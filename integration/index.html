tures.html?toc=7","section":"Supplemental: PI services, field selection and maps","verified":true},{"id":"C-S16","title":"Steps: Create Consolidation Data Capture Integration in AP&C","url":"https://doc.workday.com/admin-guide/en-us/adaptive-planning-and-consolidation/financial-accounting-in-ap&c/consolidation-data-capture-in-ap&c/pom1658872097760_1.html","section":"Supplemental: retrieval and processing diagnostics","verified":true},{"id":"C-S17","title":"Concept: Integration Events and Integration Process Events","url":"https://developer.workday.com/doc/GUID-abc27564-24fc-4d7c-a10d-5124331f4f3b.md","section":"Execution wrapper and workflow steps","verified":true},{"id":"C-S18","title":"Setup Considerations: Integrations","url":"https://developer.workday.com/doc/pmt1545076237838.md","section":"Tool selection and inbound/outbound purpose","verified":true},{"id":"O-S-aggregate","title":"Add Aggregations","url":"https://developer.workday.com/documentation/GUID-6f98991a-326a-4fc7-9085-e3d9132f1cba","section":"Purpose, properties, concepts, and examples","verified":true,"verifiedOn":"2026-10-25"},{"id":"O-S-alias","title":"Reference: WQL Aliases","url":"https://developer.workday.com/documentation/ktw1644956621314","section":"Purpose, properties, concepts, and examples","verified":true,"verifiedOn":"2026-10-25"},{"id":"O-S-api","title":"Reference: Send Workday API Request","url":"https://developer.workday.com/documentation/GUID-43efaf69-686f-4372-a0a7-5238ead1a2a7","section":"Purpose, properties, concepts, and examples","verified":true,"verifiedOn":"2026-10-25"},{"id":"O-S-batch","title":"Reference: Batch Loop","url":"https://developer.workday.com/documentation/GUID-c382cf0c-48d1-4e31-a923-641d245bd06d","section":"Purpose, properties, concepts, and examples","verified":true,"verifiedOn":"2026-10-25"},{"id":"O-S-branch","title":"Reference: Branch on Conditions","url":"https://developer.workday.com/documentation/GUID-925c6c89-cd46-4d9d-858d-cc07fe5d2b8b","section":"Purpose -82ef-b08f4f5b1acd.md","section":"Reference: ProcessingError Member Functions","verified":true},{"id":"A-S33","title":"Concept: Orchestration Builder Logs","url":"https://developer.workday.com/doc/GUID-151504dc-71a4-48c0-8c8d-3d17a478d3e4-enHYPHENus.md","section":"Concept: Orchestration Builder Logs","verified":true},{"id":"A-S34","title":"Debug Orchestrations","url":"https://developer.workday.com/doc/GUID-c56cc654-636f-43ed-97fa-308f87ce2856.md","section":"Debug Orchestrations","verified":true},{"id":"A-S35","title":"Enable Verbose Logging for Orchestrations","url":"https://developer.workday.com/doc/GUID-f0ee1e54-1665-497c-a4e5-8bc69e3e2ff8.md","section":"Enable Verbose Logging for Orchestrations","verified":true},{"id":"A-S36","title":"Reference: Log","url":"https://developer.workday.com/doc/GUID-0b8fd172-3e63-4a45-b322-f00f78e0cb3c.md","section":"Reference: Log","verified":true},{"id":"A-S37","title":"Reference: Log to File","url":"https://developer.workday.com/doc/GUID-fdeeaa27-ede6-442e-87f1-8487f44a3db9.md","section":"Reference: Log to File","verified":true},{"id":"A-S38","title":"Generate Orchestration Summary Reports","url":"https://developer.workday.com/doc/GUID-b10d8bff-e5df-4a58-98e1-20262d1656e5.md","section":"Generate Orchestration Summary Reports","verified":true},{"id":"A-S39","title":"Concept: Integration Events and Integration Process Events","url":"https://developer.workday.com/doc/GUID-abc27564-24fc-4d7c-a10d-5124331f4f3b.md","section":"Concept: Integration Events and Integration Process Events","verified":true},{"id":"A-S40","title":"Reference: Add Integration Message","url":"https://developer.workday.com/doc/GUID-d31029df-b131-4f00-8d32-dc5773e22e4c.md","section":"Reference: Add Integration Message","verified":true},{"id":"A-S41","title":"Create an Outbound Integration with Orchestrate","url":"https://developer.workday.com/doc/GUID-0c99dd81-6964-4adf-90d7-f27402c5fc9a.md","section":"Create an Outbound Integration with Orchestrate","verified":true},{"id":"A-S42","title":"Orchestration Logic and Event Flows","url":"https://doc.workday.com/workday-education/en-us/course-manuals/creating-integrations-using-workday-orchestrate/orchestration-logic-and-event-flows.html","section":"Orchestration Logic and Event Flows","verified":true},{"id":"A-S43","title":"Integration Business Process Guidelines","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-processes-guidelines/integration-business-process-guidelines.html","section":"Integration Business Process Guidelines","verified":true}],"notes":[{"topic":"outbound-connectors","title":"Configure the output deliberately","body":"Work from a suitable template. Distinguish services, field inclusion, value maps and format attributes. Test the receiver’s data contract as well as successful file delivery. For change feeds, document eligibility and the entry/effective comparison window.","sourceIds":["C-S02","C-S05","C-S07"]},{"topic":"inbound-connectors","title":"Separate retrieval from loading","body":"A file arriving successfully does not prove its rows loaded. Confirm the selected inbound template’s format and supported operations, retrieve the file before loading, and reconcile validation messages with the intended records.","sourceIds":["C-S01","C-S02","C-S05"]},{"topic":"connector-security","title":"Test the runtime identity","body":"Use the intended ISU and ISSG, grant the relevant policies, activate policy edits, and test actual output. Schedule ownership is separate from the integration’s runtime account. For DIS, distinguish UI security-test requirements from runtime permission behavior.","sourceIds":["C-S03","C-S04"]},{"topic":"calculated-fields","title":"Start with the object and result type","body":"Identify the business object, relationship cardinality and required return type first. Select a single related instance before retrieving one of its values; use a multi-instance extraction when several results are needed. Keep calculations focused and test no-match cases.","sourceIds":["C-S08","C-S12","C-S13"]},{"topic":"integration-basics","title":"Choose a tool from the requirement","body":"Direction is relative to Workday. Evaluate delivered solutions before custom development. Keep extraction, transformation, transport and scheduling distinct so that implementation and troubleshooting target the right stage.","sourceIds":["C-S01","C-S02","C-S05"]},{"topic":"raas","title":"Treat a report as a data contract","body":"Test the RaaS output with the calling identity and exact prompt values. Sharing does not replace underlying security. Maintain unique aliases and assess consumer impact before changing namespaces or output structure.","sourceIds":["C-S09","C-S10","C-S11","C-S14"]},{"topic":"connector-troubleshooting","title":"Follow the evidence","body":"Locate the event, inspect its messages and relevant audits, then reconcile records and fields. Isolate extraction, authorization, mapping and delivery issues. A completed status is useful evidence, but does not independently prove business completeness.","sourceIds":["C-S02","C-S03","C-S05","C-S07"]},{"topic":"rest-apis","title":"REST request checklist","body":"Identify the endpoint, method, payload contract, authorization, and pagination before choosing a component. Keep Workday and external request components distinct. A successful validation-only response does not mean the update was saved.","sourceIds":["O-S-api","O-S-restvalidate"]},{"topic":"soap-apis","title":"SOAP request checklist","body":"Use the correct service contract and supported version. Inspect SOAP faults instead of assuming every HTTP 500 is transient. Keep paging snapshot boundaries consistent and distinguish the paged component’s automatic envelope from a raw SOAP request.","sourceIds":["O-S-soapversions","O-S-soaperrors","O-S-soapfilter","O-S-pagedsoap"]},{"topic":"wql","title":"WQL query checklist","body":"Confirm real field aliases and data access. Separate projection, row filtering, related-object filtering, grouping, group filtering, and paging. A query LIMIT caps the total result; the request limit controls page size.","sourceIds":["O-S-alias","O-S-select","O-S-wqlpaging"]},{"topic":"orchestration-build","title":"Build and release checklist","body":"Select the launch template, name references clearly, validate, and save. Test the correct released version on the intended tenant. Installation is per tenant; an existing installation does not need to be repeated for every update.","sourceIds":["O-S-create","O-S-orchestration","O-S-install"]},{"topic":"expressions","title":"Expression checklist","body":"Check input and return types, scope, collection boundaries, and missing-value behavior. Preserve numeric and Boolean values where the payload contract expects them. Avoid unnecessary conversion of large streamed documents into in-memory strings.","sourceIds":["O-S-expr","O-S-types","O-S-json"]},{"topic":"flow","title":"Flow checklist","body":"Make branch precedence, validation outcomes, loop filtering, matching exceptions, and aggregation inclusion explicit. Logging a validation failure does not automatically stop processing. Use intentional guards before performing downstream writes.","sourceIds":["O-S-branch","O-S-validate","O-S-continue"]},{"topic":"inbound-orchestration","title":"An inbound file is a contract","body":"Retrieve the intended file, identify its format, and validate values before business updates. Missing data and malformed data need different handling.","sourceIds":["A-S21","A-S27","A-S43"]},{"topic":"outbound-orchestration","title":"Finish the complete output path","body":"Extraction and formatting do not by themselves deliver a file. Confirm storage, event attachment, and the configured delivery route separately.","sourceIds":["A-S24","A-S41"]},{"topic":"reuse","title":"Explicit interfaces make reuse predictable","body":"Pass required inputs and return declared outputs. Imported workflows are independent copies; environment attributes and tenant packages need their own configuration checks.","sourceIds":["A-S11","A-S12","A-S16"]},{"topic":"orchestration-security","title":"Authentication does not replace authorization","body":"Use the correct runtime identity and endpoint credentials. Check REST View/Modify separately from SOAP Get/Put permissions. Keep managed keys and credentials out of payloads and logs.","sourceIds":["A-S01","A-S03","A-S07"]},{"topic":"orchestration-troubleshooting","title":"Locate the failure before changing the design","body":"Use build logs for compilation, run logs for execution, and process events for workflow progression. Inspect success indicators before consuming outputs from protected steps.","sourceIds":["A-S31","A-S33","A-S39"]}]};</script><script>/* Integration Lab: browser-local study and assessment engine. */

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function correct(q,ans){const a=q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);return !!ans&&a.length===ans.length&&a.every(i=>ans.includes(i));}
function statFor(list){const seen=list.filter(q=>state.stats[q.id]);const right=seen.filter(q=>state.stats[q.id].lastCorrect);return {seen:seen.length,right:right.length,accuracy:seen.length?Math.round(100*right.length/seen.length):0};}
function nav(v){view=v;review=null;render();window.scrollTo({top:0,behavior:'instant'});document.querySelector('#main')?.focus({preventScroll:true});}
function render(){const current=view==='session'?(state.session?.mode==='exam'?'exam':'learn'):view==='results'?'progress':view==='review'?'progress':view;
const navs=[['home','Overview'],['learn','Learning mode'],['exam','Exam mode'],['bank','Question bank'],['reference','Reference desk'],['progress','My progress'],['coverage','Syllabus & sources']];
document.querySelector('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-mark">il</div><div><strong>Integration Lab</strong><small>Workday practice</small></div></div><nav aria-label="Main navigation">${navs.map(([id,label])=>`<button class="nav-item ${current===id?'active':''}" data-nav="${id}" ${current===id?'aria-current="page"':''}>${icon(id)}${label}</button>`).join('')}</nav><div class="side-foot"><strong>A little practice, every day.</strong>${DB.questions.length} questions · 18 topics<br>Independent study companion<br><span class="small">Content reviewed October 25, 2026</span></div></aside><div class="content"><header class="topbar"><span class="crumb">Your study workspace <span style="margin:0 8px;color:#b5c5c7">/</span> ${navs.find(n=>n[0]===current)?.[1]||'Practice'}</span><span class="tag green"><i class="dot"></i> Personal practice</span></header>${!storageOK?'<div class="notice storage-warning" role="status">Browser storage is unavailable. Progress lasts only for this tab; use Export backup to keep a copy.</div>':''}<main id="main" tabindex="-1">${renderView()}</main></div></div>`;bind();}
function renderView(){switch(view){case'learn':return setup('learn');case'exam':return setup('exam');case'session':return sessionPage();case'results':return resultsPage();case'review':return reviewPage();case'bank':return bankPageHTML();case'reference':return referencePage();case'progress':return progressPage();case'coverage':return coveragePage();default:return home();}}
function resumeBanner(){const s=state.session;if(!s||s.finished)return '';return `<div class="resume"><div><strong>${s.mode==='exam'?'Exam':'Learning session'} in progress</strong><p>${Object.keys(s.answers).length} of ${s.ids.length} answered${s.mode==='exam'?' · The timer continues while you are away.':''}</p></div><button class="btn small" data-action="resume">Resume ${icon('arrow')}</button></div>`;}
function home(){const st=statFor(DB.questions);return `${resumeBanner()}<section class="hero"><div><div class="eyebrow">Learn the logic. Build your confidence.</div><h1>Your next integration<br>starts with understanding.</h1><p>Practice realistic Workday scenarios, learn why every choice works or fails, and put your knowledge to the test.</p><div class="actions"><button class="btn" data-nav="learn">Start learning ${icon('arrow')}</button><button class="btn secondary" data-nav="exam">Take a practice exam</button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"><strong>18<span>connected topics</span></strong></div></div></section><div class="stats"><div class="stat"><strong>${DB.questions.length}</strong><span>Original practice questions</span></div><div class="stat"><strong>${st.seen}<span> / ${DB.questions.length}</span></strong><span>Questions attempted</span></div><div class="stat"><strong>${st.seen?st.accuracy+'%':'—'}</strong><span>Latest-answer accuracy</span></div><div class="stat"><strong>${state.history.length}</strong><span>Practice exams completed</span></div></div><div class="section-heading"><h2>Explore your learning path</h2><p>Based on your Excel syllabus</p></div><div class="cards">${GROUPS.map((g,i)=>{const list=DB.questions.filter(q=>q.group===g.id),s=statFor(list);return `<article class="card"><div class="row"><div class="card-icon">0${i+1}</div><span class="tag">${g.weight}% syllabus weight</span></div><h3>${g.title}</h3><p>${g.desc}</p><div class="progress" aria-label="${s.seen} of ${list.length} attempted"><i style="width:${list.length?s.seen/list.length*100:0}%"></i></div><div class="card-footer"><span>${s.seen} / ${list.length} explored</span><button class="text-btn" data-group="${g.id}">Practice →</button></div></article>`;}).join('')}</div><div class="notice info"><strong>Built around your materials.</strong> The Excel supplies the syllabus; the sample document supplies the scenario-question style. Practice content is independently authored from Workday documentation. <button class="text-btn" data-nav="coverage">See coverage and assumptions →</button></div><div class="footer-note">Progress is saved in this browser. Export a backup from My progress to move it between devices. This is an unofficial study aid, with no guarantee of official exam coverage or results.</div>`;}
function setup(mode){const exam=mode==='exam';return `<div class="page-title"><div><div class="eyebrow">${exam?'Test your understanding':'Build understanding, one scenario at a time'}</div><h1>${exam?'Make it an exam.':'Make it a learning session.'}</h1><p class="muted">${exam?'Answers stay hidden until you submit.':'Get a clear explanation for every answer choice.'}</p></div></div>${resumeBanner()}<div class="two-col"><form id="setup" class="panel" data-mode="${mode}"><h2>${exam?'Practice exam settings':'Choose your focus'}</h2><div class="form-grid"><label class="field full">Topic<select name="topic">${topicOptions()}</select></label><label class="field">Question count<select name="count">${optionList(exam?[[20,'20 questions'],[50,'50 questions'],[100,'100 questions']]:[[10,'10 questions'],[20,'20 questions'],[50,'50 questions'],['all','All matching questions']],exam?20:10)}</select></label>${exam?'<label class="field">Time limit (minutes)<input name="minutes" type="number" min="1" max="240" value="60" required></label>':'<label class="field">Practice pool<select name="pool"><option value="all">All questions</option><option value="unseen">Not yet attempted</option><option value="missed">Last answered incorrectly</option><option value="bookmarked">Bookmarked</option></select></label>'}<label class="field">Difficulty<select name="difficulty"><option value="all">All difficulty levels</option><option>Foundation</option><option>Applied</option><option>Advanced</option></select></label>${exam?'<label class="field">Personal score target (%)<input name="target" type="number" min="1" max="100" value="80" required></label>':''}<label class="check field full"><input type="checkbox" name="multi" ${exam?'':'checked'}>Include multiple-answer questions (supplemental practice)</label>${exam?'<label class="check field full"><input type="checkbox" name="weighted" checked>Use Excel syllabus weights when practicing all topics</label>':'<label class="check field full"><input type="checkbox" name="shuffle" checked>Randomize question order</label>'}</div><div class="form-end"><button class="btn" type="submit">${exam?'Start timed exam':'Start learning'} ${icon('arrow')}</button><p class="small muted" style="margin:12px 0 0">If fewer questions match, the session uses all available matches.</p></div></form><aside><div class="panel"><div class="eyebrow">What to expect</div><h2>${exam?'A focused practice run':'Learn the reason, not the letter'}</h2><ul class="compact-list">${(exam?['Scenario questions with shuffled answer choices.','Navigate freely, flag questions, and return later.','Automatic submission when time expires; refresh does not reset the timer.','Review every answer and your topic scores after submission.']:['Choose an answer, then check your reasoning.','See why the correct choice fits and every alternative does not.','Open the official documentation behind each question.','Return to missed questions or save useful ones with a bookmark.']).map(t=>`<li>${t}</li>`).join('')}</ul></div><div class="notice">${exam?'<strong>Practice defaults, not an official exam specification.</strong> The sample screenshots show 20 questions and an approximately 60-minute timer, on Prism content. The Integration exam duration, count and pass mark were not confirmed. Your target is a personal study goal.':'<strong>Exact-match scoring.</strong> For multiple-answer items, select every correct option and no incorrect options. The question tells you how many to select.'}</div></aside></div>`;}
function filteredPool(f){return DB.questions.filter(q=>(!f.topic||f.topic==='all'||q.topic===f.topic)&&(!f.group||q.group===f.group)&&(!f.difficulty||f.difficulty==='all'||q.difficulty===f.difficulty)&&(f.multi!==false||q.type==='single')&&(f.pool!=='unseen'||!state.stats[q.id])&&(f.pool!=='missed'||state.stats[q.id]?.lastCorrect===false)&&(f.pool!=='bookmarked'||state.bookmarks.includes(q.id)));}
function weightedSelect(pool,count){const groups=GROUPS.map(g=>({...g,pool:shuffle(pool.filter(q=>q.group===g.id)),n:0}));for(let k=0;k<count;k++){const eligible=groups.filter(g=>g.n<g.pool.length);if(!eligible.length)break;eligible.sort((a,b)=>(count*b.weight/100-b.n)-(count*a.weight/100-a.n));eligible[0].n++;}return shuffle(groups.flatMap(g=>g.pool.slice(0,g.n)));}
function begin(mode,config={},explicit=null){const pool=explicit||filteredPool(config),count=config.count==='all'?pool.length:Math.min(Number(config.count)||10,pool.length);if(!pool.length){toast('No questions match this selection. Try another topic or pool.');return;}
const create=()=>{let list=explicit||((mode==='exam'&&config.weighted&&config.topic==='all')?weightedSelect(pool,count):(config.shuffle===false?pool:shuffle(pool)).slice(0,count));const orders={};list.forEach(q=>orders[q.id]=shuffle(q.options.map((_,i)=>i)));state.session={id:Date.now().toString(36),mode,ids:list.map(q=>q.id),orders,answers:{},checked:{},flags:[],index:0,started:Date.now(),deadline:mode==='exam'?Date.now()+Number(config.minutes||60)*60000:null,target:Number(config.target||80),finished:false,weighted:!!config.weighted};save();view='session';review=null;render();window.scrollTo(0,0);};
if(state.session&&!state.session.finished)confirmBox('Replace the active session?','The current session will be replaced. Previously recorded learning progress and completed exams stay saved.','Replace session',create);else create();}
function activeContext(){if(view==='review'&&review){const attempt=state.history.find(h=>h.id===review.attemptId);return attempt?{s:attempt,ids:review.ids,index:review.index,reveal:true,isReview:true}:null;}const s=state.session;return s?{s,ids:s.ids,index:s.index,reveal:!!s.checked[s.ids[s.index]],isReview:false}:null;}
function sessionPage(){if(!state.session)return '<div class="empty">No active session. Start from Learning mode or Exam mode.</div>';return questionPage(activeContext());}
function reviewPage(){const c=activeContext();return c?questionPage(c):'<div class="empty">This review is no longer available.</div>';}
function questionPage(c){const {s,ids,index,isReview}=c,q=QMAP[ids[index]],ans=s.answers[q.id]||[],reveal=isReview||!!s.checked?.[q.id],exam=s.mode==='exam';if(!q)return '<div class="empty">Question unavailable.</div>';const order=s.orders?.[q.id]||q.options.map((_,i)=>i);const count=q.options.filter(o=>o.correct).length;
return `<div class="session-top"><div><div class="eyebrow" style="margin-bottom:6px">${isReview?'Exam review':exam?'Timed practice':'Learning mode'}</div><span class="session-title">Question ${index+1} of ${ids.length}</span></div><div class="actions">${exam&&!isReview?'<span id="timer-desc">Time remaining</span><span class="timer" id="timer" aria-label="Time remaining"></span>':''}<button class="btn secondary small" data-action="${isReview?'back-results':'save-exit'}">${isReview?'Back to results':'Save & exit'}</button></div></div><div class="progress" style="margin-bottom:22px"><i style="width:${Object.keys(s.answers).length/s.ids.length*100}%"></i></div><div class="exam-layout"><div><article class="question"><div class="row"><div class="question-meta"><span class="tag">${esc(topicName(q.topic))}</span><span class="tag ${q.difficulty==='Advanced'?'orange':''}">${esc(q.difficulty)}</span><span class="bank-id">${q.id}</span></div><button class="btn ghost small ${state.bookmarks.includes(q.id)?'bookmarked':''}" data-bookmark="${q.id}" aria-label="${state.bookmarks.includes(q.id)?'Remove bookmark':'Bookmark question'}" aria-pressed="${state.bookmarks.includes(q.id)}">${icon('bookmark')}</button></div><h2 id="question-stem">${esc(q.stem)}</h2><p class="small muted">${q.type==='multi'?`Select ${count} answers. All correct choices are required.`:'Select one answer.'}${isReview&&!ans.length?' · You left this question unanswered.':''}</p><div class="options" role="group" aria-labelledby="question-stem">${order.map((oi,pos)=>{const o=q.options[oi],sel=ans.includes(oi);return `<label class="option ${sel?'selected':''} ${reveal&&o.correct?'correct':''} ${reveal&&sel&&!o.correct?'incorrect':''}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="answer" value="${oi}" ${sel?'checked':''} ${reveal?'disabled':''}><span class="letter">${String.fromCharCode(65+pos)}</span><span class="text">${esc(o.text)}</span>${reveal&&o.correct?'<span aria-label="Correct choice">✓</span>':''}</label>`;}).join('')}</div>${reveal?feedback(q,ans,order):(!exam?'<button class="btn" data-action="check">Check answer</button>':'')}<div class="question-actions"><button class="btn secondary" data-action="previous" ${index===0?'disabled':''}>← Previous</button>${!isReview?`<button class="btn ghost ${s.flags.includes(q.id)?'bookmarked':''}" data-action="flag" aria-pressed="${s.flags.includes(q.id)}">${s.flags.includes(q.id)?'Flagged for review':'Flag for review'}</button>`:''}<button class="btn ${index===ids.length-1?'secondary':''}" data-action="next">${index===ids.length-1?(isReview?'Back to results':exam?'Review & submit':'Finish session'):'Next question →'}</button></div></article></div><aside class="navigator"><h3>Question navigator</h3><div class="number-grid">${ids.map((id,i)=>`<button class="num ${i===index?'current':''} ${s.answers[id]?.length?'answered':''} ${s.flags?.includes(id)?'flagged':''}" data-jump="${i}" aria-label="Question ${i+1}${s.answers[id]?.length?', answered':', unanswered'}${s.flags?.includes(id)?', flagged':''}" ${i===index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p>Green: answered<br><span class="legend-dot">●</span> Orange dot: flagged</p>${exam&&!isReview?'<button class="btn small" style="width:100%" data-action="submit-exam">Submit exam</button>':''}${!exam?'<p>Answers are recorded when you select Check answer.</p>':''}${isReview?'<p>Review does not change your submitted score.</p>':''}</aside></div>`;}
function sourceLinks(ids){return (ids||[]).map(id=>SMAP[id]).filter(Boolean).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}${s.section?' · '+esc(s.section):''} ↗</a>`).join('');}
function feedback(q,ans,order){const ok=correct(q,ans);return `<section class="feedback" aria-label="Answer explanation"><h3 style="color:${ok?'var(--green)':'var(--red)'}">${ok?'Correct — here’s why.':ans.length?'Not quite — let’s work through it.':'Unanswered — review the explanation.'}</h3>${order.map((oi,pos)=>{const o=q.options[oi];return `<div class="rationale"><strong>${String.fromCharCode(65+pos)}. ${o.correct?'Correct choice':'Incorrect choice'}${ans.includes(oi)?' · Your selection':''}</strong>${esc(o.reason)}</div>`;}).join('')}<div class="takeaway"><strong>Remember this</strong><br>${esc(q.takeaway)}</div><div class="sources"><strong>Check the source</strong>${sourceLinks(q.sourceIds)}</div></section>`;}
function record(q,ans){const old=state.stats[q.id]||{attempts:0,correct:0};const ok=correct(q,ans);state.stats[q.id]={attempts:old.attempts+1,correct:old.correct+(ok?1:0),lastCorrect:ok,lastSeen:Date.now()};}
function check(){const s=state.session,q=QMAP[s.ids[s.index]],a=s.answers[q.id];if(!a?.length){toast('Select an answer before checking.');return;}const count=q.options.filter(o=>o.correct).length;if(q.type==='multi'&&a.length!==count){toast(`Select exactly ${count} answers.`);return;}if(!s.checked[q.id]){s.checked[q.id]=true;record(q,a);save();render();}}
function requestFinish(){const s=state.session;if(!s)return;const unanswered=s.ids.filter(id=>!s.answers[id]?.length).length,flagged=s.flags.length;if(s.mode==='exam')confirmBox('Submit your practice exam?',`${unanswered} unanswered · ${flagged} flagged. Unanswered questions count as incorrect. Submission ends this attempt and reveals the explanations.`,'Submit exam',()=>finishExam(false));else confirmBox('Finish this learning session?',`${Object.keys(s.checked).length} of ${s.ids.length} questions checked. Your checked answers have been saved to your learning progress.`,'Finish session',()=>{state.session=null;save();nav('progress');});}
function finishExam(expired){const s=state.session;if(!s||s.finished||s.mode!=='exam')return;s.ids.forEach(id=>record(QMAP[id],s.answers[id]||[]));const h={...s,finished:true,ended:Date.now(),expired,score:s.ids.filter(id=>correct(QMAP[id],s.answers[id])).length};state.history.unshift(h);state.history=state.history.slice(0,50);state.session=null;save();review={attemptId:h.id};view='results';document.querySelector('#confirm').close();render();window.scrollTo(0,0);if(expired)toast('Time is up. Your exam was submitted automatically.');}
function selectedAttempt(){return state.history.find(h=>h.id===review?.attemptId)||state.history[0];}
function resultsPage(){const h=selectedAttempt();if(!h)return '<div class="empty">Complete a practice exam to see your results.</div>';const pct=Math.round(h.score/h.ids.length*100);return `<div class="page-title"><div><div class="eyebrow">Your practice results</div><h1>Every attempt teaches you something.</h1></div><button class="btn secondary" data-nav="exam">New exam</button></div><section class="panel"><div class="summary-score"><div class="score-ring"><strong>${pct}%</strong></div><div><h2>${pct>=h.target?'Personal target reached':'Keep building your understanding'}</h2><p class="muted" style="margin-bottom:5px">${h.score} correct of ${h.ids.length} · Target ${h.target}%</p><span class="small muted">${new Date(h.ended).toLocaleString()}${h.expired?' · Auto-submitted when time expired':''}</span></div></div><div class="actions"><button class="btn" data-review="missed">Review missed answers</button><button class="btn secondary" data-review="all">Review every question</button><button class="btn ghost" data-action="retry-missed">Practice missed questions</button></div><p class="small muted" style="margin:16px 0 0">Each question earns one point only for an exact correct selection. Unanswered items earn zero. Your target is not an official certification pass mark.</p></section><div class="section-heading"><h2>Where to focus next</h2><p>Score by topic</p></div>${scoreTable(h)}<div class="notice info">Use the reference desk for the concepts behind missed questions, then start a new practice set. Repeating a familiar question improves recall; new scenarios help test understanding.</div>`;}
function scoreTable(h){const rows=TOPICS.map(t=>{const ids=h.ids.filter(id=>QMAP[id]?.topic===t.id);return {t,n:ids.length,right:ids.filter(id=>correct(QMAP[id],h.answers[id])).length};}).filter(r=>r.n);return `<div class="table-wrap"><table><thead><tr><th>Topic</th><th>Correct</th><th>Score</th><th>Study</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.t.title}</td><td>${r.right} / ${r.n}</td><td><span class="tag ${r.right/r.n>=.8?'green':'orange'}">${Math.round(r.right/r.n*100)}%</span></td><td><button class="text-btn" data-ref-topic="${r.t.id}">Open notes →</button></td></tr>`).join('')}</tbody></table></div>`;}
function bankMatches(){const term=filters.search.toLowerCase();return DB.questions.filter(q=>(filters.topic==='all'||q.topic===filters.topic)&&(filters.difficulty==='all'||q.difficulty===filters.difficulty)&&(filters.status==='all'||(filters.status==='missed'&&state.stats[q.id]?.lastCorrect===false)||(filters.status==='unseen'&&!state.stats[q.id])||(filters.status==='bookmarked'&&state.bookmarks.includes(q.id)))&&(!term||[q.id,q.stem,topicName(q.topic),...q.options.map(o=>o.text)].join(' ').toLowerCase().includes(term)));}
function bankPageHTML(){const list=bankMatches(),pages=Math.max(1,Math.ceil(list.length/15));bankPage=Math.min(bankPage,pages-1);return `<div class="page-title"><div><div class="eyebrow">Your complete practice collection</div><h1>Question bank</h1><p class="muted">Search scenarios, choose a topic, or revisit a difficult concept.</p></div><span class="tag">${list.length} questions</span></div><div class="filters"><input id="bank-search" class="search" type="search" aria-label="Search questions" placeholder="Search WQL, permissions, error handling…" value="${esc(filters.search)}"><select id="bank-topic" aria-label="Filter by topic">${topicOptions(true,filters.topic)}</select><select id="bank-difficulty" aria-label="Filter by difficulty">${optionList([['all','All difficulty levels'],['Foundation','Foundation'],['Applied','Applied'],['Advanced','Advanced']],filters.difficulty)}</select><select id="bank-status" aria-label="Filter by status">${optionList([['all','All questions'],['unseen','Not attempted'],['missed','Last incorrect'],['bookmarked','Bookmarked']],filters.status)}</select></div><div class="bank-list">${list.slice(bankPage*15,bankPage*15+15).map(q=>`<article class="bank-item"><div class="body"><div class="question-meta"><span class="bank-id">${q.id}</span><span class="tag">${esc(topicName(q.topic))}</span><span class="tag">${q.type==='multi'?'Multiple answers':'Single answer'}</span>${state.stats[q.id]?`<span class="tag ${state.stats[q.id].lastCorrect?'green':'orange'}">${state.stats[q.id].lastCorrect?'Last correct':'Needs practice'}</span>`:''}</div><h3>${esc(q.stem)}</h3><span class="small muted">${esc(q.difficulty)}</span></div><button class="btn secondary small" data-practice="${q.id}">Practice →</button></article>`).join('')||'<div class="empty">No questions match. Try a broader search or different filters.</div>'}</div><div class="pagination"><button class="btn secondary small" data-action="bank-prev" ${bankPage===0?'disabled':''}>Previous</button><span>Page ${bankPage+1} of ${pages}</span><button class="btn secondary small" data-action="bank-next" ${bankPage>=pages-1?'disabled':''}>Next</button></div>`;}
function referencePage(){const notes=DB.notes.filter(n=>(refFilter==='all'||n.topic===refFilter)&&(!refSearch||[n.title,n.body,topicName(n.topic)].join(' ').toLowerCase().includes(refSearch.toLowerCase())));return `<div class="page-title"><div><div class="eyebrow">Connect the answer to the concept</div><h1>Reference desk</h1><p class="muted">Concise study notes with links to the official documentation.</p></div></div><div class="filters" style="grid-template-columns:2fr 1fr"><input id="ref-search" class="search" type="search" aria-label="Search study notes" placeholder="Find a concept…" value="${esc(refSearch)}"><select id="ref-topic" aria-label="Filter notes by topic">${topicOptions(true,refFilter)}</select></div>${notes.map(n=>`<article class="note"><span class="tag">${esc(topicName(n.topic))}</span><h3 style="margin-top:14px">${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="sources">${sourceLinks(n.sourceIds)}</div><div style="margin-top:16px"><button class="text-btn" data-topic="${n.topic}">Practice this topic →</button></div></article>`).join('')||'<div class="empty">No notes match this search.</div>'}<div class="notice info">These notes support revision; the linked manuals and developer references provide the full configuration details. Documentation and tenant behavior may change with Workday releases.</div>`;}
function progressPage(){const s=statFor(DB.questions);return `<div class="page-title"><div><div class="eyebrow">Your learning, over time</div><h1>My progress</h1><p class="muted">Stored in this browser. Export a backup to keep or move your progress.</p></div></div>${resumeBanner()}<div class="stats"><div class="stat"><strong>${s.seen}</strong><span>Unique questions attempted</span></div><div class="stat"><strong>${s.seen?s.accuracy+'%':'—'}</strong><span>Latest-answer accuracy</span></div><div class="stat"><strong>${Object.values(state.stats).filter(v=>!v.lastCorrect).length}</strong><span>Questions to revisit</span></div><div class="stat"><strong>${state.bookmarks.length}</strong><span>Saved bookmarks</span></div></div><div class="actions"><button class="btn" data-action="practice-missed">Practice missed questions</button><button class="btn secondary" data-action="practice-bookmarks">Practice bookmarks</button></div><div class="section-heading"><h2>Topic progress</h2><p>Latest checked or submitted answer</p></div><div class="table-wrap"><table><thead><tr><th>Topic</th><th>Attempted</th><th>Latest accuracy</th><th>Continue</th></tr></thead><tbody>${TOPICS.map(t=>{const list=DB.questions.filter(q=>q.topic===t.id),st=statFor(list);return `<tr><td>${t.title}</td><td>${st.seen} / ${list.length}</td><td>${st.seen?st.accuracy+'%':'—'}</td><td><button class="text-btn" data-topic="${t.id}">Practice →</button></td></tr>`;}).join('')}</tbody></table></div><div class="section-heading"><h2>Exam history</h2><p>Up to 50 recent attempts</p></div>${state.history.length?`<div class="table-wrap"><table><thead><tr><th>Completed</th><th>Questions</th><th>Score</th><th>Review</th></tr></thead><tbody>${state.history.map(h=>`<tr><td>${new Date(h.ended).toLocaleString()}</td><td>${h.ids.length}</td><td>${Math.round(h.score/h.ids.length*100)}% (${h.score}/${h.ids.length})</td><td><button class="text-btn" data-history="${h.id}">View results →</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Your first completed practice exam will appear here.</div>'}<div class="section-heading"><h2>Keep your study workspace</h2></div><div class="panel"><div class="actions"><button class="btn secondary" data-action="export">Export progress backup</button><button class="btn secondary" data-action="import">Import progress backup</button><button class="btn secondary" data-action="download-app">Download offline app</button><button class="btn ghost" data-action="reset">Reset progress</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><p class="small muted" style="margin:14px 0 0">The offline app contains the full question bank. Open it in your browser; reference links need internet. Progress in an offline file and the hosted app may be separate—use backups to transfer it.</p></div>`;}
function coveragePage(){return `<div class="page-title"><div><div class="eyebrow">Know what you’re practicing</div><h1>Syllabus & sources</h1><p class="muted">${DB.questions.length} original questions across all 18 topics in your Excel.</p></div></div><div class="notice"><strong>Scope and exam alignment.</strong> No finite bank covers every possible question or scenario. This app targets every topic supplied in <em>inte.xlsx</em>, with substantial Orchestrate and Integration Apps practice. It does not reproduce or claim to predict official certification questions.</div><section class="panel"><h2>Current certification pathway</h2><p class="small">Workday’s public certification page identifies the Workday Pro Workday Orchestrate Developer Certification as the successor to the former Workday Pro Integrations Certification, and recommends the same two courses you supplied. The public page does not establish the question count, duration or passing score used here.</p><a class="small" href="https://community-content.workday.com/en-us/public/learn/training/workday-pro/workday-pro-certifications/integrations-pro-certifications.html" target="_blank" rel="noopener noreferrer">Workday’s certification overview ↗</a></section><section class="panel" style="margin-top:20px"><h2>How your materials shaped the app</h2><ul class="compact-list"><li><strong>inte.xlsx:</strong> 18 syllabus rows, not a question bank. Seven weights appear at the start of successive groups: 22%, 11%, 16%, 16%, 11%, 14%, and 10%. Grouping the following unweighted rows under each weight is an interpretation of the spreadsheet layout.</li><li><strong>sample_questions.docx:</strong> the inspected screenshots show Prism scenarios with four choices, navigation, flags, and a 20-question assessment with roughly 60 minutes. The app matches that presentation style for Integration topics. Selected answers in screenshots were not treated as a verified answer key.</li><li><strong>Your references:</strong> the Creating and Securing Integrations manual, Creating Integrations Using Workday Orchestrate manual (listed twice in your request), and official Workday developer documentation.</li><li><strong>Practice settings:</strong> default 20 questions, 60 minutes, and 80% personal target. These are configurable practice settings, not verified specifications for the newly released Integration certification exam. Single-answer mode is the default; multiple-answer questions are supplemental.</li></ul></section><div class="section-heading"><h2>Coverage map</h2><p>Counts describe this bank, not official exam proportions</p></div><div class="table-wrap"><table><thead><tr><th>Syllabus group</th><th>Weight</th><th>Included topics</th><th>Questions</th></tr></thead><tbody>${GROUPS.map(g=>`<tr><td>${g.title}</td><td>${g.weight}%</td><td>${TOPICS.filter(t=>t.group===g.id).map(t=>t.title).join(' · ')}</td><td>${DB.questions.filter(q=>q.group===g.id).length}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:12px">Weighted exams select questions close to these percentages, subject to rounding and available matching questions. Small exams may not include every topic. The bank itself intentionally gives Orchestrate broad coverage.</p><div class="section-heading"><h2>Source directory</h2><p>${DB.sources.length} reference entries</p></div><p class="small muted">Questions link to their supporting sections. Short answer rationales apply the documented concepts to original scenarios; they are not quotations from the course. Reviewed October 25, 2026.</p>${GROUPS.map(g=>{const ids=new Set(DB.questions.filter(q=>q.group===g.id).flatMap(q=>q.sourceIds));return `<details><summary>${g.title} · ${ids.size} references</summary><div class="sources">${sourceLinks([...ids])}</div></details>`;}).join('')}<div class="footer-note">Independent personal study tool. Workday names and product terms are used for identification. This app is not affiliated with or endorsed by Workday. It does not connect to your tenant or run actual integrations.</div>`;}

function confirmBox(title,message,label,fn){const d=document.querySelector('#confirm');d.innerHTML=`<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="actions"><button class="btn" id="confirm-yes">${esc(label)}</button><button class="btn secondary" id="confirm-no">Cancel</button></div>`;d.querySelector('#confirm-yes').onclick=()=>{d.close();fn();};d.querySelector('#confirm-no').onclick=()=>d.close();d.showModal();}
function moveTo(i){const c=activeContext();if(!c)return;if(c.isReview)review.index=Math.max(0,Math.min(c.ids.length-1,i));else {state.session.index=Math.max(0,Math.min(c.ids.length-1,i));save();}render();window.scrollTo({top:0,behavior:'instant'});document.querySelector('#question-stem')?.scrollIntoView({block:'nearest'});}
function setSearch(id,fn){const el=document.getElementById(id);if(!el)return;el.oninput=()=>{const val=el.value,pos=el.selectionStart;fn(val);render();const n=document.getElementById(id);n.focus();try{n.setSelectionRange(pos,pos);}catch{}};}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>begin('learn',{group:b.dataset.group,count:20,multi:true,shuffle:true}));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>begin('learn',{topic:b.dataset.topic,count:20,multi:true,shuffle:true}));document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>begin('learn',{},[QMAP[b.dataset.practice]]));document.querySelectorAll('[data-ref-topic]').forEach(b=>b.onclick=()=>{refFilter=b.dataset.refTopic;refSearch='';nav('reference');});
document.querySelectorAll('[data-bookmark]').forEach(b=>b.onclick=()=>{const id=b.dataset.bookmark;if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);save();render();});
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>moveTo(Number(b.dataset.jump)));
document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{review={attemptId:b.dataset.history};view='results';render();window.scrollTo(0,0);});
document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const h=selectedAttempt();const ids=b.dataset.review==='all'?h.ids:h.ids.filter(id=>!correct(QMAP[id],h.answers[id]));if(!ids.length){toast('You answered every question correctly.');return;}review={attemptId:h.id,ids,index:0};view='review';render();window.scrollTo(0,0);});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
document.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{const s=state.session;if(!s||view!=='session'||s.finished)return;const q=QMAP[s.ids[s.index]];if(s.checked[q.id])return;const selected=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>Number(x.value));const n=q.options.filter(o=>o.correct).length;if(q.type==='multi'&&selected.length>n){el.checked=false;toast(`This question asks for ${n} answers.`);return;}if(selected.length)s.answers[q.id]=selected;else delete s.answers[q.id];save();render();document.querySelector(`input[name="answer"][value="${el.value}"]`)?.focus({preventScroll:true});});
const setupForm=document.querySelector('#setup');if(setupForm)setupForm.onsubmit=e=>{e.preventDefault();const f=new FormData(setupForm);begin(setupForm.dataset.mode,{topic:f.get('topic'),count:f.get('count'),minutes:f.get('minutes'),target:f.get('target'),difficulty:f.get('difficulty'),pool:f.get('pool'),multi:f.has('multi'),weighted:f.has('weighted'),shuffle:setupForm.dataset.mode==='exam'||f.has('shuffle')});};
setSearch('bank-search',v=>{filters.search=v;bankPage=0;});for(const k of ['topic','difficulty','status']){const el=document.getElementById('bank-'+k);if(el)el.onchange=()=>{filters[k]=el.value;bankPage=0;render();};}setSearch('ref-search',v=>refSearch=v);const rt=document.getElementById('ref-topic');if(rt)rt.onchange=()=>{refFilter=rt.value;render();};const file=document.getElementById('import-file');if(file)file.onchange=importBackup;updateTimer();}
function action(a){switch(a){case'resume':view='session';review=null;render();break;case'save-exit':save();nav('home');break;case'check':check();break;case'previous':moveTo(activeContext().index-1);break;case'next':{const c=activeContext();if(c.index<c.ids.length-1)moveTo(c.index+1);else if(c.isReview){view='results';render();window.scrollTo(0,0);}else requestFinish();break;}case'flag':{const s=state.session,id=s.ids[s.index];s.flags=s.flags.includes(id)?s.flags.filter(v=>v!==id):[...s.flags,id];save();render();break;}case'submit-exam':requestFinish();break;case'back-results':view='results';render();window.scrollTo(0,0);break;case'bank-prev':bankPage--;render();window.scrollTo(0,0);break;case'bank-next':bankPage++;render();window.scrollTo(0,0);break;case'practice-missed':begin('learn',{pool:'missed',count:'all',multi:true});break;case'practice-bookmarks':begin('learn',{pool:'bookmarked',count:'all',multi:true});break;case'retry-missed':{const h=selectedAttempt(),qs=h.ids.filter(id=>!correct(QMAP[id],h.answers[id])).map(id=>QMAP[id]);if(qs.length)begin('learn',{},qs);else toast('No missed questions in this attempt.');break;}case'export':download('integration-lab-progress.json',JSON.stringify({app:'integration-lab',exported:new Date().toISOString(),state},null,2),'application/json');break;case'import':document.querySelector('#import-file').click();break;case'download-app':{const html='<!doctype html>\n'+document.documentElement.outerHTML;download('Workday_Integration_Practice_Lab.html',html,'text/html');toast('Offline app downloaded. Export progress separately if needed.');break;}case'reset':confirmBox('Reset your practice progress?','This removes your saved answers, bookmarks, active session and exam history from this browser. Export a backup first if you want to keep them.','Reset progress',()=>{state={version:1,stats:{},bookmarks:[],history:[],session:null};save();nav('progress');toast('Progress reset.');});break;}}
function updateTimer(){const s=state.session;if(s?.mode!=='exam'||s.finished)return;const seconds=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));const el=document.querySelector('#timer');if(el){el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');el.classList.toggle('low',seconds<300);}if(seconds===0)finishExam(true);}
function download(name,body,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function validateBackup(v){if(v?.app!=='integration-lab'||v.state?.version!==1)throw Error('This is not an Integration Lab progress backup.');const x=v.state;
if(!x.stats||typeof x.stats!=='object'||Array.isArray(x.stats)||!Array.isArray(x.bookmarks)||!Array.isArray(x.history)||x.history.length>50)throw Error('The backup structure is invalid.');
const known=id=>typeof id==='string'&&Object.hasOwn(QMAP,id);
const finite=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0;
const stats={};for(const [id,s] of Object.entries(x.stats)){if(!known(id))continue;if(!s||!Number.isInteger(s.attempts)||s.attempts<1||!Number.isInteger(s.correct)||s.correct<0||s.correct>s.attempts||typeof s.lastCorrect!=='boolean'||!finite(s.lastSeen))throw Error('The backup has invalid progress records.');stats[id]={attempts:s.attempts,correct:s.correct,lastCorrect:s.lastCorrect,lastSeen:s.lastSeen};}
const sanitizeSession=(s,finished)=>{if(!s||typeof s.id!=='string'||s.id.length>80||!['learn','exam'].includes(s.mode)||!Array.isArray(s.ids)||!s.ids.length||s.ids.length>DB.questions.length||!s.ids.every(known)||new Set(s.ids).size!==s.ids.length||!s.answers||!s.orders||!finite(s.started)||!finite(s.target)||s.target<1||s.target>100)throw Error('The backup contains an invalid session.');
const answers={},orders={},checked={};for(const id of s.ids){const n=QMAP[id].options.length,o=s.orders[id];if(!Array.isArray(o)||o.length!==n||new Set(o).size!==n||!o.every(i=>Number.isInteger(i)&&i>=0&&i<n))throw Error('Invalid answer ordering.');orders[id]=o;const a=s.answers[id];if(a!==undefined){if(!Array.isArray(a)||new Set(a).size!==a.length||!a.every(i=>Number.isInteger(i)&&i>=0&&i<n))throw Error('Invalid answer selection.');answers[id]=a;}if(s.checked?.[id]===true)checked[id]=true;}
if(!Number.isInteger(s.index)||s.index<0||s.index>=s.ids.length||!Array.isArray(s.flags)||!s.flags.every(id=>s.ids.includes(id)))throw Error('Invalid question navigation.');if(s.mode==='exam'&&!finite(s.deadline))throw Error('Invalid timer.');const out={id:s.id,mode:s.mode,ids:s.ids,orders,answers,checked,flags:[...new Set(s.flags)],index:s.index,started:s.started,deadline:s.mode==='exam'?s.deadline:null,target:s.target,finished,weighted:!!s.weighted};if(finished){if(!finite(s.ended))throw Error('Invalid completion time.');out.ended=s.ended;out.expired=!!s.expired;out.score=s.ids.filter(id=>correct(QMAP[id],answers[id])).length;}return out;};
return {version:1,stats,bookmarks:[...new Set(x.bookmarks.filter(known))],history:x.history.map(h=>sanitizeSession(h,true)),session:x.session?sanitizeSession(x.session,false):null};}
async function importBackup(e){const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('This file is too large for a progress backup.');const imported=validateBackup(JSON.parse(await f.text()));confirmBox('Replace progress with this backup?',`Import ${Object.keys(imported.stats).length} attempted questions and ${imported.history.length} completed exams. Current progress in this browser will be replaced.`,'Import backup',()=>{state=imported;save();nav('progress');toast('Progress imported.');});}catch(err){toast(err.message||'The backup could not be imported.');}finally{e.target.value='';}}
render();setInterval(updateTimer,1000);
</script></body></html>
