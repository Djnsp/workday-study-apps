:"outbound-connectors","group":"connectors","difficulty":"Foundation","type":"single","stem":"A field is available in an enabled Payroll Interface data section, but the receiver must not receive it. Which setting addresses this?","options":[{"text":"The schedule recurrence","correct":false,"reason":"Frequency does not determine the output schema."},{"text":"The field attribute that controls inclusion in output","correct":true,"reason":"This controls whether the field is emitted."},{"text":"The integration display name","correct":false,"reason":"Names do not govern individual output fields."},{"text":"The SFTP port","correct":false,"reason":"Transport settings do not select payload fields."}],"takeaway":"This controls whether the field is emitted.","sourceIds":["C-S15"]},{"id":"C004","topic":"outbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A Payroll Interface receiver needs an external code for a Workday value. The connector exposes a map for that field. What is the best configuration?","options":[{"text":"Grant the ISU Put permission","correct":false,"reason":"Write permission does not translate codes."},{"text":"Change the extraction date","correct":false,"reason":"A date boundary does not map codes."},{"text":"Map the Workday value to the receiver’s external code","correct":true,"reason":"The map translates equivalent business values."},{"text":"Override the entire field with a single constant","correct":false,"reason":"That would erase distinctions among different source values."}],"takeaway":"The map translates equivalent business values.","sourceIds":["C-S15"]},{"id":"C005","topic":"outbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A connector exposes a Country Code Type attribute. The receiver requests three-character country codes. What should you review?","options":[{"text":"The field’s maximum length only","correct":false,"reason":"Truncating a two-character code cannot produce the correct three-character code."},{"text":"The report owner’s language only","correct":false,"reason":"This is not the connector’s explicit code-type setting."},{"text":"The number of retries","correct":false,"reason":"Retries repeat delivery rather than reformat data."},{"text":"The integration attribute value","correct":true,"reason":"The attribute controls the supported representation."}],"takeaway":"The attribute controls the supported representation.","sourceIds":["C-S02"]},{"id":"C006","topic":"outbound-connectors","group":"connectors","difficulty":"Foundation","type":"single","stem":"An outbound connector produces the correct file. You must send it to an SFTP endpoint. Which process step is appropriate?","options":[{"text":"Service – Document Delivery","correct":true,"reason":"This sends the generated document outward."},{"text":"Service – Document Retrieval","correct":false,"reason":"Retrieval obtains an incoming file."},{"text":"Approval Chain","correct":false,"reason":"Approval alone does not transfer a file."},{"text":"To Do","correct":false,"reason":"A task notification is not automated file delivery."}],"takeaway":"This sends the generated document outward.","sourceIds":["C-S05"]},{"id":"C007","topic":"outbound-connectors","group":"connectors","difficulty":"Applied","type":"multi","stem":"You are configuring delivery of a connector output. Which TWO inputs belong in this configuration? Select two.","options":[{"text":"A new primary business object","correct":false,"reason":"Transport setup does not redesign reporting objects."},{"text":"The document source","correct":true,"reason":"Delivery must identify which generated document to send."},{"text":"Transport and authentication details","correct":true,"reason":"The endpoint and credentials enable the transfer."},{"text":"A change to the worker’s legal name","correct":false,"reason":"Delivery does not require modifying business data."}],"takeaway":"Delivery must identify which generated document to send.","sourceIds":["C-S05"]},{"id":"C008","topic":"outbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"An eligible worker’s included output field changed during the comparison window. A Full-Diff extract includes the worker. What data is expected?","options":[{"text":"Every worker regardless of eligibility","correct":false,"reason":"Eligibility still limits the population."},{"text":"Only a transaction count","correct":false,"reason":"The requested extract still carries business data."},{"text":"The configured data for that worker instance","correct":true,"reason":"Full-Diff selects changed instances, then includes their data."},{"text":"Only the changed character","correct":false,"reason":"This is not a character-level patch format."}],"takeaway":"Full-Diff selects changed instances, then includes their data.","sourceIds":["C-S07"]},{"id":"C009","topic":"outbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A payroll feed must reevaluate its change window on each scheduled run. Which launch parameter mode is most suitable?","options":[{"text":"Specify Value with today’s date entered once","correct":false,"reason":"The literal date will not advance automatically."},{"text":"Remove every date parameter","correct":false,"reason":"The connector still needs its date context."},{"text":"Change only the schedule frequency","correct":false,"reason":"Frequency alone does not make a literal date dynamic."},{"text":"Determine Value at Runtime","correct":true,"reason":"Dynamic fields recalculate the boundaries."}],"takeaway":"Dynamic fields recalculate the boundaries.","sourceIds":["C-S07"]},{"id":"C010","topic":"outbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A supported worker connector struggles with a large extraction. Which service should you assess for report-field-based retrieval?","options":[{"text":"Data Initialization Service","correct":true,"reason":"DIS provides an alternative extraction mechanism."},{"text":"Document Delivery","correct":false,"reason":"Delivery begins after extraction."},{"text":"An approval step","correct":false,"reason":"Approval does not improve data retrieval."},{"text":"A notification recipient group","correct":false,"reason":"Recipients do not change extraction performance."}],"takeaway":"DIS provides an alternative extraction mechanism.","sourceIds":["C-S06"]},{"id":"C011","topic":"outbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A DIS worker connector must include only an eligible population. Where should you configure the Boolean eligibility rule?","options":[{"text":"Only the sequence generator","correct":false,"reason":"Sequence numbers do not define the eligible population."},{"text":"Configure Integration Population Eligibility","correct":true,"reason":"DIS uses this worker-population configuration."},{"text":"Only the Define Eligibility field override","correct":false,"reason":"DIS ignores that legacy eligibility location."},{"text":"Only the external-value map","correct":false,"reason":"Value translation is not worker-population eligibility."}],"takeaway":"DIS uses this worker-population configuration.","sourceIds":["C-S06"]},{"id":"C012","topic":"outbound-connectors","group":"connectors","difficulty":"Advanced","type":"single","stem":"A connector uses top-of-stack processing. A selected field changes from A to B and back to A within the comparison window. What can happen?","options":[{"text":"The connector must fail","correct":false,"reason":"Matching endpoint values are not a processing error."},{"text":"The worker must appear because a transaction exists","correct":false,"reason":"Candidate detection does not guarantee a net output-field change."},{"text":"No net change is returned for that field","correct":true,"reason":"The compared starting and ending values match."},{"text":"Both intermediate changes always return","correct":false,"reason":"That assumes effective-stack behavior."}],"takeaway":"The compared starting and ending values match.","sourceIds":["C-S07"]},{"id":"C013","topic":"inbound-connectors","group":"connectors","difficulty":"Foundation","type":"single","stem":"A supplier sends organization data that must create records inside Workday. Relative to Workday, which direction is this integration?","options":[{"text":"Outbound","correct":false,"reason":"Outbound sends Workday data elsewhere."},{"text":"Reporting only","correct":false,"reason":"Creating records is more than reading a report."},{"text":"A full-diff export","correct":false,"reason":"An export has the opposite direction."},{"text":"Inbound","correct":true,"reason":"The data enters Workday."}],"takeaway":"The data enters Workday.","sourceIds":["C-S18"]},{"id":"C014","topic":"inbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A project needs to create and update organizations using a delivered inbound template. Which connector should be evaluated?","options":[{"text":"Core Connector: Organization Inbound","correct":true,"reason":"Its business purpose matches organization imports."},{"text":"Core Connector: Worker outbound","correct":false,"reason":"That extracts worker information."},{"text":"A benefits outbound connector","correct":false,"reason":"That targets a different dataset and direction."},{"text":"A RaaS report alone","correct":false,"reason":"A report does not create organization records."}],"takeaway":"Its business purpose matches organization imports.","sourceIds":["C-S02"]},{"id":"C015","topic":"inbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A finance team receives accounting journal data from another system. Which delivered template is the closest starting point?","options":[{"text":"A custom report enabled as a service","correct":false,"reason":"A report retrieves rather than imports journal transactions."},{"text":"Core Connector: Accounting Journal Inbound","correct":true,"reason":"It is designed for importing journals."},{"text":"Core Connector: Positions","correct":false,"reason":"Positions are not accounting journals."},{"text":"A worker outbound connector","correct":false,"reason":"This has the wrong direction and business purpose."}],"takeaway":"It is designed for importing journals.","sourceIds":["C-S02"]},{"id":"C016","topic":"inbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"An inbound process must fetch a file before the connector can load it. Which service belongs before Fire Integration?","options":[{"text":"A completion notification only","correct":false,"reason":"A notification does not fetch the input."},{"text":"An output field override","correct":false,"reason":"An output mapping does not retrieve a file."},{"text":"Document Retrieval","correct":true,"reason":"The input must be available before processing."},{"text":"Document Delivery","correct":false,"reason":"Delivery sends an output to a receiver."}],"takeaway":"The input must be available before processing.","sourceIds":["C-S05"]},{"id":"C017","topic":"inbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A delivered generic inbound connector meets all business requirements, but the external XML has a different structure. What design should you assess?","options":[{"text":"Changing the file extension to .xml","correct":false,"reason":"Renaming does not transform structure."},{"text":"Disabling all security","correct":false,"reason":"Permissions do not fix incompatible structure."},{"text":"Using a report to write the records","correct":false,"reason":"RaaS does not perform the inbound write."},{"text":"A supported transformation before the connector load","correct":true,"reason":"The input must satisfy the connector’s format contract."}],"takeaway":"The input must satisfy the connector’s format contract.","sourceIds":["C-S01"]},{"id":"C018","topic":"inbound-connectors","group":"connectors","difficulty":"Advanced","type":"single","stem":"The team assumes every inbound connector accepts a changes-only file. What is the best response?","options":[{"text":"Verify the selected template’s input contract","correct":true,"reason":"Capabilities differ; Organization Inbound does not support changes-only files."},{"text":"The assumption is safe for all connectors","correct":false,"reason":"Inbound capabilities are not universal."},{"text":"Full-Diff output guarantees matching inbound support","correct":false,"reason":"Outbound detection says nothing about inbound file requirements."},{"text":"The transport protocol determines this capability","correct":false,"reason":"SFTP does not define connector load semantics."}],"takeaway":"Capabilities differ; Organization Inbound does not support changes-only files.","sourceIds":["C-S02"]},{"id":"C019","topic":"inbound-connectors","group":"connectors","difficulty":"Applied","type":"single","stem":"A consolidation inbound integration retrieved its CSV successfully, but the intended records did not load. What should you inspect next?","options":[{"text":"Assume retrieval success also proves schema validity","correct":false,"reason":"A transferred file may still fail application validation."},{"text":"The processing messages and available audit diagnostics","correct":true,"reason":"Retrieval success establishes only that the file arrived."},{"text":"Assume that Workday accepted every row","correct":false,"reason":"Transfer and application processing are different stages."},{"text":"Increase the outbound delivery attempts","correct":false,"reason":"This does not investigate the inbound load."}],"takeaway":"Retrieval success establishes only that the file arrived.","sourceIds":["C-S16"]},{"id":"C020","topic":"inbound-connectors","group":"connectors","difficulty":"Applied","type":"multi","stem":"An inbound connector must update Workday data. Which TWO checks matter before production? Select two.","options":[{"text":"A report can display the data for an administrator","correct":false,"reason":"An administrator’s read access does not prove write access for the ISU."},{"text":"The outbound change-detection settings are enabled","correct":false,"reason":"Those do not establish an inbound load’s validity or authorization."},{"text":"The input meets the selected template’s format requirements","correct":true,"reason":"The load must receive compatible data."},{"text":"The runtime user has the required write and process permissions","correct":true,"reason":"Authorized application updates require appropriate access."}],"takeaway":"The load must receive compatible data.","sourceIds":["C-S01","C-S03"]},{"id":"C021","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"single","stem":"A scheduled integration runs under an employee who is changing roles. What account model reduces this dependency?","options":[{"text":"Keep the employee account permanently privileged","correct":false,"reason":"This preserves the personnel dependency and excess access."},{"text":"Use the recipient’s email address as the runtime user","correct":false,"reason":"An address is not an authorized tenant identity."},{"text":"Remove authentication from the integration","correct":false,"reason":"The integration still requires an authorized identity."},{"text":"Use an appropriately secured Integration System User","correct":true,"reason":"A non-person account separates runtime access from job changes."}],"takeaway":"A non-person account separates runtime access from job changes.","sourceIds":["C-S04"]},{"id":"C022","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"single","stem":"You created an ISU and added it to an ISSG. It cannot read the required data. What is missing from this setup?","options":[{"text":"Relevant permissions granted to the ISSG through security policies","correct":true,"reason":"Membership alone does not grant the needed data access."},{"text":"A longer integration name","correct":false,"reason":"Naming does not authorize data access."},{"text":"An extra file extension","correct":false,"reason":"File type does not grant permissions."},{"text":"A different scheduled start time","correct":false,"reason":"Timing does not supply missing authorization."}],"takeaway":"Membership alone does not grant the needed data access.","sourceIds":["C-S04"]},{"id":"C023","topic":"connector-security","group":"connectors","difficulty":"Foundation","type":"single","stem":"An outbound connector reads positions and does not update them. Which integration permission should you prefer for the required read domain?","options":[{"text":"No domain permission","correct":false,"reason":"The ISU must still be authorized to retrieve data."},{"text":"Get","correct":true,"reason":"Read access matches the requirement."},{"text":"Put only","correct":false,"reason":"Put addresses updates, not this read requirement."},{"text":"Every available permission","correct":false,"reason":"This grants unnecessary capability."}],"takeaway":"Read access matches the requirement.","sourceIds":["C-S03"]},{"id":"C024","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"single","stem":"A web service operation triggers a Workday business process. Domain access alone has not resolved authorization. What else should you inspect?","options":[{"text":"Only the integration map defaults","correct":false,"reason":"Value mapping cannot grant process authorization."},{"text":"Only the delivery protocol","correct":false,"reason":"Transport selection does not authorize a Workday process."},{"text":"The relevant business process security policy","correct":true,"reason":"Some write operations also require process authorization."},{"text":"Only the connector’s optional output services","correct":false,"reason":"They do not grant permission to initiate the business process."}],"takeaway":"Some write operations also require process authorization.","sourceIds":["C-S03"]},{"id":"C025","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"single","stem":"An administrator granted the ISSG the required domain permission. The next run still behaves as before. What should be checked first?","options":[{"text":"Whether output fields were alphabetized","correct":false,"reason":"Field order does not activate policy edits."},{"text":"Whether a new scheduled run was created","correct":false,"reason":"Rescheduling does not activate pending permissions."},{"text":"Whether the report was shared with an administrator","correct":false,"reason":"An administrator’s access does not apply the ISU’s pending policy."},{"text":"Whether pending security policy changes were activated","correct":true,"reason":"Unactivated policy edits are not effective."}],"takeaway":"Unactivated policy edits are not effective.","sourceIds":["C-S03"]},{"id":"C026","topic":"connector-security","group":"connectors","difficulty":"Foundation","type":"single","stem":"Which tool helps identify the policy securing a failed web service operation?","options":[{"text":"View Security for Securable Item","correct":true,"reason":"It connects a securable operation to its policies."},{"text":"Integration Template Catalog only","correct":false,"reason":"The catalog helps choose templates, not inspect a specific permission."},{"text":"Maintain Custom Report XML Alias","correct":false,"reason":"Aliases describe report output naming."},{"text":"Configure Integration Maps","correct":false,"reason":"Maps translate values, not security policies."}],"takeaway":"It connects a securable operation to its policies.","sourceIds":["C-S03"]},{"id":"C027","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"single","stem":"A feed must access only workers in designated organizations. Which security-group characteristic should be assessed?","options":[{"text":"An administrator’s personal account","correct":false,"reason":"That does not enforce the stated restricted scope."},{"text":"A constrained ISSG with suitable organization scope","correct":true,"reason":"It supports contextual organization restrictions."},{"text":"An unconstrained ISSG automatically limited by its name","correct":false,"reason":"Names do not define access boundaries."},{"text":"Any group containing the word Payroll","correct":false,"reason":"A label is not a permission rule."}],"takeaway":"It supports contextual organization restrictions.","sourceIds":["C-S04"]},{"id":"C028","topic":"connector-security","group":"connectors","difficulty":"Advanced","type":"single","stem":"What does an unconstrained ISSG mean?","options":[{"text":"It never requires an ISU","correct":false,"reason":"The integration still needs a runtime identity."},{"text":"It cannot be audited","correct":false,"reason":"Scope does not remove auditability."},{"text":"Its granted access is not organization-constrained","correct":true,"reason":"It still needs permissions on the relevant domains."},{"text":"It has access to every domain automatically","correct":false,"reason":"Unconstrained scope is not universal permission."}],"takeaway":"It still needs permissions on the relevant domains.","sourceIds":["C-S04"]},{"id":"C029","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"single","stem":"You assigned an ISU to the integration system. The schedule still belongs to its original creator. What should you do?","options":[{"text":"Assume ownership already changed","correct":false,"reason":"The two settings are separate."},{"text":"Create a second ISU and leave ownership unchanged","correct":false,"reason":"Another account does not resolve the existing ownership dependency."},{"text":"Grant the employee permanent administrator access","correct":false,"reason":"That retains the personnel dependency and adds excessive access."},{"text":"Transfer schedule ownership separately","correct":true,"reason":"Runtime account assignment does not transfer the schedule."}],"takeaway":"Runtime account assignment does not transfer the schedule.","sourceIds":["C-S03"]},{"id":"C030","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"single","stem":"An ISU must own a schedule. Which permission is needed for the Launch / Schedule Integration task?","options":[{"text":"Modify access through the Integration Event domain","correct":true,"reason":"This authorizes launching and scheduling."},{"text":"Only Get access to worker data","correct":false,"reason":"Reading worker data does not authorize scheduling."},{"text":"Only output-folder write access","correct":false,"reason":"External file access does not authorize Workday scheduling."},{"text":"Integration Debug access by default","correct":false,"reason":"Debug capability is unnecessary for this purpose."}],"takeaway":"This authorizes launching and scheduling.","sourceIds":["C-S03"]},{"id":"C031","topic":"connector-security","group":"connectors","difficulty":"Applied","type":"multi","stem":"After replacing an administrator runtime account with an ISU, the event completes. Which TWO validations are most useful? Select two.","options":[{"text":"Restore administrator access without investigating","correct":false,"reason":"This bypasses the intended security design."},{"text":"Compare expected populations and field values","correct":true,"reason":"Success status alone may hide missing data."},{"text":"Confirm the necessary permissions without excessive grants","correct":true,"reason":"The goal includes least-privilege access."},{"text":"Assume Completed proves all business requirements","correct":false,"reason":"Completion is not a full reconciliation."}],"takeaway":"Success status alone may hide missing data.","sourceIds":["C-S03","C-S04"]},{"id":"C032","topic":"connector-security","group":"connectors","difficulty":"Advanced","type":"single","stem":"A DIS field override returns data at runtime using Integration Get, but its UI security test says inaccessible. What explains the discrepancy?","options":[{"text":"The runtime output must be fabricated","correct":false,"reason":"The UI result alone does not establish that."},{"text":"Field overrides cannot be used with DIS","correct":false,"reason":"DIS supports configurable field overrides."},{"text":"The UI test may require Report/Task View permission","correct":true,"reason":"The manual distinguishes the UI test from runtime access."},{"text":"DIS never supports Integration Get at runtime","correct":false,"reason":"The documented runtime behavior contradicts this."}],"takeaway":"The manual distinguishes the UI test from runtime access.","sourceIds":["C-S03"]},{"id":"C033","topic":"connector-security","group":"connectors","difficulty":"Advanced","type":"single","stem":"Which change requires Activate Pending Security Policy Changes?","options":[{"text":"Updating only an integration map","correct":false,"reason":"A mapping edit is not a security-policy change."},{"text":"Changing only security-group membership","correct":false,"reason":"Membership changes themselves do not require policy activation."},{"text":"Changing only an integration attribute","correct":false,"reason":"An attribute value is not a security-policy permission."},{"text":"Adding an ISSG to a domain security policy","correct":true,"reason":"This is a policy-permission change."}],"takeaway":"This is a policy-permission change.","sourceIds":["C-S03"]},{"id":"C034","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"A field created on Worker is not available in an unrelated object context. What should you investigate?","options":[{"text":"The business object and relationship path","correct":true,"reason":"Calculated-field availability depends on object context."},{"text":"The external code map","correct":false,"reason":"Code translation does not establish a business-object relationship."},{"text":"The document delivery transport","correct":false,"reason":"Transport does not affect field availability in an object context."},{"text":"The integration event retention setting","correct":false,"reason":"Retention does not redefine the calculated field’s object."}],"takeaway":"Calculated-field availability depends on object context.","sourceIds":["C-S08"]},{"id":"C035","topic":"calculated-fields","group":"connectors","difficulty":"Foundation","type":"single","stem":"A source value changes after a calculated field was created. When is the derived value normally determined?","options":[{"text":"Only after manually importing derived values","correct":false,"reason":"The defined calculation does not require manual import of its result."},{"text":"When the calculation is used at runtime","correct":true,"reason":"The field derives from current applicable source data."},{"text":"Only once when the field is created","correct":false,"reason":"It is not a fixed stored snapshot."},{"text":"Only when a security policy is activated","correct":false,"reason":"Policy activation does not define when a calculation resolves."}],"takeaway":"The field derives from current applicable source data.","sourceIds":["C-S08"]},{"id":"C036","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"A receiver needs a worker’s family name followed by a comma and given name. Which calculated-field function combines those pieces?","options":[{"text":"Date Difference","correct":false,"reason":"Date arithmetic does not combine text."},{"text":"Lookup Range Band","correct":false,"reason":"A numeric range band does not assemble a name."},{"text":"Concatenate Text","correct":true,"reason":"It joins the selected text values and separators."},{"text":"Count Related Instances","correct":false,"reason":"A count does not assemble a name."}],"takeaway":"It joins the selected text values and separators.","sourceIds":["C-S12"]},{"id":"C037","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"A vendor requires city names in uppercase. Which function directly addresses this requirement?","options":[{"text":"Format Number","correct":false,"reason":"The source is not a numeric value."},{"text":"Extract Multi-Instance","correct":false,"reason":"No instance filtering is required."},{"text":"Increment or Decrement Date","correct":false,"reason":"Dates are unrelated to text capitalization."},{"text":"Format Text","correct":true,"reason":"It can change text case."}],"takeaway":"It can change text case.","sourceIds":["C-S12"]},{"id":"C038","topic":"calculated-fields","group":"connectors","difficulty":"Foundation","type":"single","stem":"An Evaluate Expression field has two true conditions. Which configured result wins?","options":[{"text":"The value for the first true condition","correct":true,"reason":"Evaluation stops at the first match."},{"text":"The value for the last true condition","correct":false,"reason":"Later matching conditions are not evaluated after a match."},{"text":"Both values concatenated automatically","correct":false,"reason":"The function does not automatically concatenate matches."},{"text":"Always the default","correct":false,"reason":"The default is used when no condition matches."}],"takeaway":"Evaluation stops at the first match.","sourceIds":["C-S08"]},{"id":"C039","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"An Evaluate Expression field tests active status and leave status. Neither condition is true. What determines the result?","options":[{"text":"The result from the previous evaluation","correct":false,"reason":"The current evaluation uses its own conditions and default."},{"text":"Its configured default value","correct":true,"reason":"The default handles the no-match case."},{"text":"The final condition’s return value even when false","correct":false,"reason":"A false condition does not override the default."},{"text":"All configured return values combined","correct":false,"reason":"The function returns the matching value or default, not every result."}],"takeaway":"The default handles the no-match case.","sourceIds":["C-S08"]},{"id":"C040","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"A worker has several certifications. You need the most recently issued qualifying certification. Which function fits?","options":[{"text":"Text Constant","correct":false,"reason":"A constant cannot select a changing certification."},{"text":"Count Related Instances","correct":false,"reason":"The count does not identify the certification."},{"text":"Extract Single Instance with a condition and date ordering","correct":true,"reason":"It chooses one instance from the qualifying set."},{"text":"Extract Multi-Instance alone","correct":false,"reason":"This can return several certifications."}],"takeaway":"It chooses one instance from the qualifying set.","sourceIds":["C-S13"]},{"id":"C041","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"You selected one qualifying certification from a worker’s collection. Now you need that certification’s issuer on Worker. What is the next step?","options":[{"text":"Count the worker’s certifications","correct":false,"reason":"The count is not the issuer."},{"text":"Use Format Text directly on the original collection","correct":false,"reason":"Formatting does not select the issuer field from the chosen instance."},{"text":"Use the certification count as the issuer value","correct":false,"reason":"A count and an issuer are different results."},{"text":"Lookup Related Value through the selected instance","correct":true,"reason":"It retrieves a field from that single related instance."}],"takeaway":"It retrieves a field from that single related instance.","sourceIds":["C-S12","C-S13"]},{"id":"C042","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"A worker
