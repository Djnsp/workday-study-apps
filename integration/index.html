delivered template code","correct":false,"reason":"Delivered templates are not edited directly."}],"takeaway":"This makes the override configuration available for such templates.","sourceIds":["C-S02"]},{"id":"C045","topic":"calculated-fields","group":"connectors","difficulty":"Applied","type":"single","stem":"A DIS connector needs a supported calculated-field override. Must you first create a separate custom override service?","options":[{"text":"Yes, without exception for every connector","correct":false,"reason":"The documented DIS exception makes this false."},{"text":"No, because DIS cannot use overrides","correct":false,"reason":"DIS can use overrides; that is not the reason."},{"text":"Only if the schedule is monthly","correct":false,"reason":"Scheduling frequency does not determine this setup."},{"text":"No; DIS provides built-in override configuration","correct":true,"reason":"The DIS path differs from the common non-DIS setup."}],"takeaway":"The DIS path differs from the common non-DIS setup.","sourceIds":["C-S06"]},{"id":"C046","topic":"calculated-fields","group":"connectors","difficulty":"Advanced","type":"multi","stem":"A heavily nested calculated field slows a large extract. Which TWO changes are worth assessing? Select two.","options":[{"text":"Use more specific source relationships","correct":true,"reason":"This can reduce the instances evaluated."},{"text":"Use existing report filters where they meet the requirement","correct":true,"reason":"Unnecessary calculated-field work can be avoided."},{"text":"Add extra nested calculations to every branch","correct":false,"reason":"That adds work without resolving the design."},{"text":"Assume all calculated fields are stored and free to read","correct":false,"reason":"They are evaluated at runtime."}],"takeaway":"This can reduce the instances evaluated.","sourceIds":["C-S08","C-S13"]},{"id":"C047","topic":"integration-basics","group":"basics","difficulty":"Foundation","type":"single","stem":"An expense application receives approved Workday expense data nightly. Relative to Workday, what is this feed?","options":[{"text":"A security policy activation","correct":false,"reason":"Activation does not export expense data."},{"text":"Outbound","correct":true,"reason":"Workday is the data source."},{"text":"Inbound","correct":false,"reason":"Inbound would bring data into Workday."},{"text":"A tenant restore","correct":false,"reason":"This is a data exchange, not a restore."}],"takeaway":"Workday is the data source.","sourceIds":["C-S18"]},{"id":"C048","topic":"integration-basics","group":"basics","difficulty":"Applied","type":"single","stem":"A delivered connector extracts the correct data, but its output must become a receiver-specific non-XML format. Which addition should you assess?","options":[{"text":"A report owner change only","correct":false,"reason":"Ownership does not transform the file."},{"text":"Disabling the extraction service","correct":false,"reason":"That would remove the source data."},{"text":"Document Transformation","correct":true,"reason":"It can transform connector output."},{"text":"A second unrelated inbound connector","correct":false,"reason":"That does not format this output."}],"takeaway":"It can transform connector output.","sourceIds":["C-S01"]},{"id":"C049","topic":"integration-basics","group":"basics","difficulty":"Applied","type":"single","stem":"A new integration must call several APIs and apply custom event-driven logic; no packaged connector fits. Which browser-based tool should you assess?","options":[{"text":"Only the Integration Template Catalog report","correct":false,"reason":"The catalog is a research tool, not the custom runtime."},{"text":"Only a static CSV export","correct":false,"reason":"That does not implement the workflow."},{"text":"Only changing report column labels","correct":false,"reason":"Presentation changes do not orchestrate API calls."},{"text":"Workday Orchestrate","correct":true,"reason":"Its workflow model supports custom integration logic."}],"takeaway":"Its workflow model supports custom integration logic.","sourceIds":["C-S18"]},{"id":"C050","topic":"integration-basics","group":"basics","difficulty":"Applied","type":"single","stem":"A team adds Document Transformation to a connector. Which component still obtains the original Workday extract?","options":[{"text":"The connector","correct":true,"reason":"Transformation operates on its supplied data."},{"text":"The transformation automatically replaces extraction","correct":false,"reason":"Transforming a document does not inherently acquire it."},{"text":"Document Delivery","correct":false,"reason":"Transport sends a document; it does not perform the source extraction."},{"text":"The integration notification","correct":false,"reason":"Notifications report status rather than obtain the business dataset."}],"takeaway":"Transformation operates on its supplied data.","sourceIds":["C-S01"]},{"id":"C051","topic":"integration-basics","group":"basics","difficulty":"Foundation","type":"single","stem":"Before designing a custom connector replacement, where can you inspect delivered integration templates?","options":[{"text":"Scheduled Future Processes only","correct":false,"reason":"That lists scheduling information, not the template catalog."},{"text":"Integration Template Catalog","correct":true,"reason":"It provides delivered template choices and details."},{"text":"Maintain Custom Report XML Alias","correct":false,"reason":"That manages report XML names."},{"text":"Activate Pending Security Policy Changes","correct":false,"reason":"That applies security edits."}],"takeaway":"It provides delivered template choices and details.","sourceIds":["C-S02"]},{"id":"C052","topic":"integration-basics","group":"basics","difficulty":"Foundation","type":"single","stem":"A developer needs the formal operations and message contract for a SOAP service. Which artifact is relevant?","options":[{"text":"An integration notification subject","correct":false,"reason":"Notification text does not define the API."},{"text":"A report display theme","correct":false,"reason":"Visual styling is unrelated to service structure."},{"text":"WSDL","correct":true,"reason":"It describes the service contract."},{"text":"A CSV delimiter","correct":false,"reason":"A delimiter is not a SOAP contract."}],"takeaway":"It describes the service contract.","sourceIds":["C-S01"]},{"id":"C053","topic":"integration-basics","group":"basics","difficulty":"Foundation","type":"multi","stem":"Which TWO characteristics correctly describe a SOAP request? Select two.","options":[{"text":"It can contain a header and body within an envelope","correct":true,"reason":"Those sections organize SOAP message information."},{"text":"It is defined by an arbitrary spreadsheet formula","correct":false,"reason":"A formula is not the SOAP message contract."},{"text":"It must be a JSON array with no XML","correct":false,"reason":"That contradicts SOAP’s XML message model."},{"text":"It uses an XML message structure","correct":true,"reason":"SOAP messages are XML-based."}],"takeaway":"SOAP messages are XML-based.","sourceIds":["C-S01"]},{"id":"C054","topic":"integration-basics","group":"basics","difficulty":"Applied","type":"single","stem":"An analyst compares yesterday’s integration execution with today’s. Which statement correctly describes an Integration Event?","options":[{"text":"It wraps a particular run, including status, messages and documents","correct":true,"reason":"An event provides execution-specific evidence."},{"text":"It is the reusable integration configuration alone","correct":false,"reason":"The event represents execution, rather than only the reusable definition."},{"text":"It contains only the file-delivery transport settings","correct":false,"reason":"Its scope includes more than transport configuration."},{"text":"It is a security group used to grant permissions","correct":false,"reason":"A security group is a different object."}],"takeaway":"Use the event to inspect a specific execution.","sourceIds":["C-S17"]},{"id":"C055","topic":"integration-basics","group":"basics","difficulty":"Applied","type":"single","stem":"An integration should run after another integration reaches a configured successful status. Which schedule pattern should you assess?","options":[{"text":"Use an output filename shared by both integrations","correct":false,"reason":"A shared name does not create a process dependency."},{"text":"Dependent scheduling","correct":true,"reason":"It can trigger based on another process and status."},{"text":"A fixed time with no dependency check","correct":false,"reason":"The predecessor may not have finished."},{"text":"Use a recurring schedule with the same start time","correct":false,"reason":"Simultaneous schedules do not establish completion ordering."}],"takeaway":"It can trigger based on another process and status.","sourceIds":["C-S05"]},{"id":"C056","topic":"integration-basics","group":"basics","difficulty":"Applied","type":"single","stem":"A vendor-specific connector is available and meets requirements. Which statement best describes remaining implementation responsibility?","options":[{"text":"Successful download of documentation proves the feed works","correct":false,"reason":"Documentation access is not an integration test."},{"text":"All future business requirements are automatically covered","correct":false,"reason":"Requirement changes still need assessment."},{"text":"Tenant configuration and testing are still required","correct":true,"reason":"A delivered template does not remove implementation validation."},{"text":"The customer never needs to configure anything","correct":false,"reason":"Delivered connectors still need tenant-specific setup."}],"takeaway":"A delivered template does not remove implementation validation.","sourceIds":["C-S01","C-S02"]},{"id":"C057","topic":"raas","group":"basics","difficulty":"Foundation","type":"single","stem":"A custom advanced report must serve as an integration data source through a URL. Which option should be configured?","options":[{"text":"Only mark the report as temporary","correct":false,"reason":"Temporary status controls lifecycle, not web-service exposure."},{"text":"Only share the report with a security group","correct":false,"reason":"Sharing is separate from enabling the RaaS endpoint."},{"text":"Only define a column XML alias","correct":false,"reason":"Aliases do not independently enable the web service."},{"text":"Enable as Web Service","correct":true,"reason":"This exposes the report as RaaS."}],"takeaway":"This exposes the report as RaaS.","sourceIds":["C-S09"]},{"id":"C058","topic":"raas","group":"basics","difficulty":"Applied","type":"multi","stem":"The report owner can run a RaaS report, but the integration user cannot. Which TWO areas should you check? Select two.","options":[{"text":"Report sharing for the integration identity","correct":true,"reason":"The runtime identity needs access to the report."},{"text":"Data-source and field security","correct":true,"reason":"Sharing alone does not grant underlying data access."},{"text":"The report’s chart type","correct":false,"reason":"A chart type does not authorize the caller."},{"text":"The sort order of visible columns","correct":false,"reason":"Sorting does not grant access to the report or its data."}],"takeaway":"The runtime identity needs access to the report.","sourceIds":["C-S09"]},{"id":"C059","topic":"raas","group":"basics","difficulty":"Applied","type":"single","stem":"A report is based on Worker, but the design now requires a different primary business object. What should you do?","options":[{"text":"Switch to any unrelated data source in the same report","correct":false,"reason":"The existing PBO limits that change."},{"text":"Create an appropriate report definition for the new object","correct":true,"reason":"Changing the data source is limited to the existing PBO."},{"text":"Change only the displayed report name","correct":false,"reason":"The displayed name does not redefine the PBO."},{"text":"Use a field alias matching the new object","correct":false,"reason":"Output labels do not change report context."}],"takeaway":"Changing the data source is limited to the existing PBO.","sourceIds":["C-S09"]},{"id":"C060","topic":"raas","group":"basics","difficulty":"Applied","type":"single","stem":"An advanced report needs to exclude workers outside one region. The region filter field should not appear in the output. Is that possible?","options":[{"text":"Only if all security is removed","correct":false,"reason":"Security is unrelated to this layout choice."},{"text":"Only by deleting workers from the tenant","correct":false,"reason":"Filtering does not require deleting records."},{"text":"Yes; a filter field need not be an output column","correct":true,"reason":"Selection criteria and displayed columns are separate."},{"text":"No; every filter field must be displayed","correct":false,"reason":"The reporting model does not impose that restriction."}],"takeaway":"Selection criteria and displayed columns are separate.","sourceIds":["C-S09"]},{"id":"C061","topic":"raas","group":"basics","difficulty":"Applied","type":"single","stem":"A RaaS consumer expects a stable XML alias for each column. Two columns now have the same alias. What should you fix?","options":[{"text":"Only reorder the rows","correct":false,"reason":"Ordering does not make identical aliases unique."},{"text":"Only change the schedule timezone","correct":false,"reason":"Timezone has no effect on alias uniqueness."},{"text":"Grant the ISU more domains","correct":false,"reason":"Permissions do not repair duplicate aliases."},{"text":"Assign unique XML aliases","correct":true,"reason":"Duplicate names violate the report’s alias requirement."}],"takeaway":"Duplicate names violate the report’s alias requirement.","sourceIds":["C-S10"]},{"id":"C062","topic":"raas","group":"basics","difficulty":"Advanced","type":"single","stem":"An integration parses RaaS XML by namespace. The report name is changed, but its namespace was not manually edited. What behavior is documented?","options":[{"text":"The existing RaaS namespace remains unchanged","correct":true,"reason":"Renaming alone does not regenerate it."},{"text":"Every rename always creates a new namespace","correct":false,"reason":"This contradicts the documented stability behavior."},{"text":"The report becomes a SOAP write operation","correct":false,"reason":"Renaming does not change its purpose."},{"text":"All output fields become numeric","correct":false,"reason":"A name change does not alter field types."}],"takeaway":"Renaming alone does not regenerate it.","sourceIds":["C-S11"]},{"id":"C063","topic":"raas","group":"basics","difficulty":"Applied","type":"single","stem":"A team manually changes a RaaS namespace. What should happen to consumers that depend on the old namespace?","options":[{"text":"Change only the report owner’s display name","correct":false,"reason":"That does not update consumer parsing."},{"text":"Update and retest their namespace references","correct":true,"reason":"The consumer must match the revised output contract."},{"text":"Nothing; consumers can never be affected","correct":false,"reason":"Namespace-sensitive parsing can fail."},{"text":"Give every consumer administrator permissions","correct":false,"reason":"Authorization does not repair namespace matching."}],"takeaway":"The consumer must match the revised output contract.","sourceIds":["C-S11"]},{"id":"C064","topic":"raas","group":"basics","difficulty":"Foundation","type":"single","stem":"A downstream service explicitly requires JSON. Which RaaS output option should be evaluated?","options":[{"text":"A screenshot of the report","correct":false,"reason":"An image is not the required machine-readable payload."},{"text":"A notification email subject","correct":false,"reason":"This does not carry the report’s JSON structure."},{"text":"JSON","correct":true,"reason":"It matches the requested data format."},{"text":"CSV because all RaaS URLs return CSV","correct":false,"reason":"RaaS supports multiple output formats."}],"takeaway":"It matches the requested data format.","sourceIds":["C-S11"]},{"id":"C065","topic":"raas","group":"basics","difficulty":"Applied","type":"single","stem":"You need to restrict which dependent instances appear under each worker in an advanced report. Which area handles related-object filtering?","options":[{"text":"Only the report name","correct":false,"reason":"A title does not filter dependent instances."},{"text":"Only the integration transport URL","correct":false,"reason":"Transport does not alter report logic."},{"text":"Only the schedule owner","correct":false,"reason":"Ownership does not define the dependent filter."},{"text":"Subfilter","correct":true,"reason":"This applies criteria to related business objects."}],"takeaway":"This applies criteria to related business objects.","sourceIds":["C-S09"]},{"id":"C066","topic":"raas","group":"basics","difficulty":"Applied","type":"single","stem":"A RaaS report accepts From Date and To Date prompts to compare historical phone values. What should a repeatable test record?","options":[{"text":"The prompt values and expected comparison results","correct":true,"reason":"Different date inputs intentionally change the result set."},{"text":"Only the selected output format","correct":false,"reason":"Format alone does not reproduce the historical comparison."},{"text":"Only the current worker count","correct":false,"reason":"A count alone does not identify the date inputs or expected records."},{"text":"Only the report owner","correct":false,"reason":"Ownership alone does not document the comparison window."}],"takeaway":"Different date inputs intentionally change the result set.","sourceIds":["C-S14"]},{"id":"C067","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A new ISU-based connector cannot obtain its first page of data. Which evidence can reveal the attempted SOAP operation?","options":[{"text":"The integration map defaults alone","correct":false,"reason":"Mapping defaults do not identify the failed API call."},{"text":"MessagesAudit requests and responses","correct":true,"reason":"The operation provides a starting point for security diagnosis."},{"text":"The schedule recurrence alone","correct":false,"reason":"Frequency does not show the failed SOAP operation."},{"text":"The document delivery configuration alone","correct":false,"reason":"The failure happened during data retrieval, before delivery."}],"takeaway":"The operation provides a starting point for security diagnosis.","sourceIds":["C-S03"]},{"id":"C068","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A DIS extraction is slow. Which event action can retrieve its technical performance information?","options":[{"text":"Increase delivery retries without reviewing extraction","correct":false,"reason":"Retries do not diagnose extraction performance."},{"text":"Change the delivery password immediately","correct":false,"reason":"There is no evidence of a delivery authentication problem."},{"text":"Retrieve Technical Files","correct":true,"reason":"This provides technical diagnostics for the event."},{"text":"Change only the output format","correct":false,"reason":"First measure where the extraction spends time."}],"takeaway":"This provides technical diagnostics for the event.","sourceIds":["C-S06"]},{"id":"C069","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A DIS run completed with a DIS Exception warning. What should you do next?","options":[{"text":"Treat Completed with Warnings as proof of full data","correct":false,"reason":"Warnings can signal omissions or processing problems."},{"text":"Grant every available domain immediately","correct":false,"reason":"That skips targeted diagnosis and adds excess access."},{"text":"Ignore the warning because a file exists","correct":false,"reason":"A file can exist despite missing or failed data."},{"text":"Read the warning and retrieve its technical files","correct":true,"reason":"The details help identify the actual security or processing exception."}],"takeaway":"The details help identify the actual security or processing exception.","sourceIds":["C-S03"]},{"id":"C070","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"A Full Extract event has no Data Changes Audit. Which interpretation is supported?","options":[{"text":"That audit is not generated for Full Extract events","correct":true,"reason":"Its absence can be expected for this run type."},{"text":"Every extraction must have failed","correct":false,"reason":"Missing this specific audit does not prove failure."},{"text":"The transaction log has necessarily been corrupted","correct":false,"reason":"This audit’s absence is expected for Full Extract."},{"text":"The receiving system rejected the file","correct":false,"reason":"An absent change audit does not establish receiver behavior."}],"takeaway":"Its absence can be expected for this run type.","sourceIds":["C-S07"]},{"id":"C071","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"A scheduled delta feed unexpectedly advances its comparison baseline after a manual run. What explains this?","options":[{"text":"Any map edit resets every effective date","correct":false,"reason":"A map edit does not explain the documented manual-run interaction."},{"text":"The last completed run can include a manual execution","correct":true,"reason":"The schedule’s dynamic baseline may use that event."},{"text":"Manual runs can never affect scheduled runs","correct":false,"reason":"The documented baseline behavior allows this interaction."},{"text":"Changing transport protocol resets all delta baselines","correct":false,"reason":"Transport selection is not the described last-run reference."}],"takeaway":"The schedule’s dynamic baseline may use that event.","sourceIds":["C-S07"]},{"id":"C072","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"A related object changes, affecting worker output, but the transaction-log candidate selection misses it. Which approach should you assess?","options":[{"text":"Change only the external code map","correct":false,"reason":"Mapping does not repair candidate selection."},{"text":"Increase SFTP delivery retries","correct":false,"reason":"Transfer retries cannot add omitted workers."},{"text":"Full-Diff without transaction-log filtering","correct":true,"reason":"It can detect indirect changes missed by direct-event selection."},{"text":"Keep the same transaction filter and repeat the same window","correct":false,"reason":"The same candidate selection can miss the same indirect change."}],"takeaway":"It can detect indirect changes missed by direct-event selection.","sourceIds":["C-S07"]},{"id":"C073","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A new external code appears unchanged in a connector output without an event error. What should you investigate?","options":[{"text":"Assume every code was translated correctly","correct":false,"reason":"A completed status does not prove mapping completeness."},{"text":"Assume a field-length setting translated the code","correct":false,"reason":"Length restriction is not a code map."},{"text":"Change the last successful effective date only","correct":false,"reason":"Date selection does not supply the code translation."},{"text":"The map’s fallback behavior and unmapped values","correct":true,"reason":"Some connectors pass unmapped values without errors."}],"takeaway":"Some connectors pass unmapped values without errors.","sourceIds":["C-S02"]},{"id":"C074","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A connector generated a correct document, but delivery failed with authentication details in the message. Where should troubleshooting focus first?","options":[{"text":"The configured endpoint credentials and transport","correct":true,"reason":"The evidence points to the delivery stage."},{"text":"Reconfigure every field override first","correct":false,"reason":"The evidence already establishes correct generated content."},{"text":"Changing worker eligibility","correct":false,"reason":"Population filtering does not fix endpoint authentication."},{"text":"Granting unrelated Workday domains","correct":false,"reason":"External endpoint credentials are a different control."}],"takeaway":"The evidence points to the delivery stage.","sourceIds":["C-S05"]},{"id":"C075","topic":"connector-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"multi","stem":"A changed worker is absent from a delta file. Which TWO checks directly address selection? Select two.","options":[{"text":"The number of document-delivery retries","correct":false,"reason":"Retries repeat transfer; they do not change the extracted population."},{"text":"Eligibility and included output fields","correct":true,"reason":"The worker and changed data must qualify for output."},{"text":"Entry/effective boundaries and transaction-log subscriptions","correct":true,"reason":"These define whether the change is considered."},{"text":"The receiver’s chosen CSV delimiter","correct":false,"reason":"A delimiter does not determine which workers the connector selects."}],"takeaway":"The worker and changed data must qualify for output.","sourceIds":["C-S07"]},{"id":"O001","topic":"rest-apis","group":"apis","difficulty":"Foundation","type":"single","stem":"An orchestration must call a vendor’s HTTPS endpoint. Which component is intended for this request?","options":[{"text":"Send HTTP Request","reason":"It supports authenticated requests to external endpoints.","correct":true},{"text":"Send Workday RaaS Request","reason":"This targets Workday report services.","correct":false},{"text":"Send Paged Workday SOAP Call","reason":"This targets Workday SOAP services.","correct":false},{"text":"Create JSON","reason":"It builds data but sends no request.","correct":false}],"takeaway":"It supports authenticated requests to external endpoints.","sourceIds":["O-S-http"]},{"id":"O002","topic":"rest-apis","group":"apis","difficulty":"Applied","type":"single","stem":"A vendor rejects chunked uploads. Which request adjustment directly addresses this incompatibility?","options":[{"text":"Switch the response to XML","reason":"Response parsing cannot change request transfer encoding.","correct":false},{"text":"Increase the retry count","reason":"Repeating an unsupported transfer does not fix it.","correct":false},{"text":"Rename the step","reason":"Its reference name does not control transport.","correct":false},{"text":"Disable chunk encoding","reason":"Transfer encoding must match the endpoint’s capabilities.","correct":true}],"takeaway":"Transfer encoding must match the endpoint’s capabilities.","sourceIds":["O-S-http"]},{"id":"O003","topic":"rest-apis","group":"apis","difficulty":"Foundation","type":"single","stem":"A Workday API needs a PATCH request with JSON data already produced upstream. Choose the most direct setup.","options":[{"text":"Create Values alone","reason":"Creating values does not invoke an API.","correct":false},{"text":"Send Workday RaaS Request; attach the JSON","reason":"RaaS retrieves report output.","correct":false},{"text":"Send Workday API Request; reference the existing JSON body","reason":"This component supports PATCH and an existing request body.","correct":true},{"text":"Send Paged Workday REST Call; use POST","reason":"The paged component uses GET.","correct":false}],"takeaway":"This component supports PATCH and an existing request body.","sourceIds":["O-S-api"]},{"id":"O004","topic":"rest-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A Workday request needs separate metadata and file parts. Which body option is designed for this?","options":[{"text":"Loop Early Stop","reason":"Stopping iteration does not compose a request body.","correct":false},{"text":"Form Multipart Body","reason":"Each part can carry its own data and content type.","correct":true},{"text":"Query Parameters only","reason":"URL parameters do not create multipart body parts.","correct":false},{"text":"Flatten Result","reason":"Flattening combines paginated results.","correct":false}],"takeaway":"Each part can carry its own data and content type.","sourceIds":["O-S-api"]},{"id":"O005","topic":"rest-apis","group":"apis","difficulty":"Foundation","type":"single","stem":"A Workday REST collection spans several pages. Which component handles its paginated retrieval?","options":[{"text":"Send Paged Workday REST Call","reason":"It retrieves paginated Workday REST responses.","correct":true},{"text":"Send Paged Workday SOAP Call","reason":"It processes SOAP XML responses.","correct":false},{"text":"Create Text Template","reason":"It renders data without retrieving pages.","correct":false},{"text":"Validate","reason":"Validation does not fetch data.","correct":false}],"takeaway":"It retrieves paginated Workday REST responses.","sourceIds":["O-S-pagedrest"]},{"id":"O006","topic":"rest-apis","group":"apis","difficulty":"Applied","type":"single","stem":"A developer sets Limit to 50 and Max Pages to 2 for a paged REST extract. What does this configuration mean?","options":[{"text":"Exactly two records","reason":"Max Pages counts pages, not records.","correct":false},{"text":"Fifty pages with two items each","reason":"The meanings are reversed.","correct":false},{"text":"All matching records regardless of page count","reason":"The explicit page cap limits retrieval.","correct":false},{"text":"At most two pages of up to 50 items each","reason":"Limit controls page size; Max Pages caps fetched pages.","correct":true}],"takeaway":"Limit controls page size; Max Pages caps fetched pages.","sourceIds":["O-S-pagedrest"]},{"id":"O007","topic":"rest-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A vendor returns a next-page URL that already contains the cursor parameter. What avoids malformed pagination requests?","options":[{"text":"Replace the cursor with the page size","reason":"These values serve different purposes.","correct":false},{"text":"Change every subsequent request to POST","reason":"This paged component uses GET.","correct":false},{"text":"Do not duplicate that parameter in Query Parameters","reason":"The returned URL already supplies the required cursor.","correct":true},{"text":"Append the cursor twice","reason":"Duplicate parameters can break pagination.","correct":false}],"takeaway":"The returned URL already supplies the required cursor.","sourceIds":["O-S-pagedhttp"]},{"id":"O008","topic":"rest-apis","group":"apis","difficulty":"Applied","type":"multi","stem":"An external API returns its continuation token in JSON. Which two configuration values identify how to send and locate it?","options":[{"text":"App Promotion Level","reason":"Lifecycle promotion does not identify pagination tokens.","correct":false},{"text":"Next Page Parameter Name","reason":"This names the outgoing continuation parameter.","correct":true},{"text":"Next Page Token Path","reason":"This locates the token in the response.","correct":true},{"text":"SOAP Service Version","reason":"This external pagination is not SOAP service selection.","correct":false}],"takeaway":"This names the outgoing continuation parameter.","sourceIds":["O-S-pagedhttp"]},{"id":"O009","topic":"rest-apis","group":"apis","difficulty":"Applied","type":"single","stem":"An ISU can call a SOAP operation but a comparable REST GET is denied. Which permission distinction matters?","options":[{"text":"REST needs Report/Task View permissions on its securing domain","reason":"SOAP Integration permissions alone do not authorize REST.","correct":true},{"text":"REST only checks Integration Get permissions","reason":"Those permissions apply to SOAP services.","correct":false},{"text":"An ISU automatically bypasses REST security","reason":"The ISU remains subject to security policies.","correct":false},{"text":"A valid OAuth token grants every domain","reason":"Authentication does not grant missing authorization.","correct":false}],"takeaway":"SOAP Integration permissions alone do not authorize REST.","sourceIds":["O-S-restsecurity"]},{"id":"O010","topic":"rest-apis","group":"apis","difficulty":"Advanced","type":"multi","stem":"A REST subresource write fails although its own domain was reviewed. Which two checks are appropriate?","options":[{"text":"Relevant Modify and business process permissions","reason":"Writes and process actions require their applicable permissions.","correct":true},{"text":"Whether the password appears in the payload","reason":"Credentials should not be inserted into business data.","correct":false},{"text":"Whether the response is flattened","reason":"Flattening does not grant access.","correct":false},{"text":"Access to the parent resource","reason":"Subresource access also depends on the parent resource.","correct":true}],"takeaway":"Writes and process actions require their applicable permissions.","sourceIds":["O-S-restsecurity"]},{"id":"O011","topic":"rest-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A REST update returns 200 with x-validate-only: 1, but the record is unchanged. Why?","options":[{"text":"The body must be sent as CSV","reason":"The header, not an arbitrary format change, explains this result.","correct":false},{"text":"Workday ignores all PUT requests","reason":"PUT is a supported write method.","correct":false},{"text":"The request was validated without persisting data","reason":"Validate-only mode deliberately avoids performing the update.","correct":true},{"text":"Every REST 200 means asynchronous processing","reason":"That is not the meaning of this validation response.","correct":false}],"takeaway":"Validate-only mode deliberately avoids performing the update.","sourceIds":["O-S-restvalidate"]},{"id":"O012","topic":"rest-apis","group":"apis","difficulty":"Applied","type":"single","stem":"After a successful validate-only REST test, which action performs the intended authorized update?","options":[{"text":"Only refresh the browser","reason":"Refreshing does not send the write request.","correct":false},{"text":"Resend without x-validate-only, or set it to 0","reason":"This turns off validate-only behavior.","correct":true},{"text":"Set x-validate-only to 1 again","reason":"That repeats validation without saving.","correct":false},{"text":"Change the method to GET","reason":"GET does not perform the requested write.","correct":false}],"takeaway":"This turns off validate-only behavior.","sourceIds":["O-S-restvalidate"]},{"id":"O013","topic":"soap-apis","group":"apis","difficulty":"Foundation","type":"single","stem":"A Send Paged Workday SOAP Call body fails after a developer wraps it in a SOAP envelope. What should change?","options":[{"text":"Remove the manually added envelope","reason":"This component supplies the SOAP envelope automatically.","correct":true},{"text":"Add a second envelope","reason":"Nested envelopes make the request invalid.","correct":false},{"text":"Convert the request to JSON","reason":"The component calls SOAP and expects XML.","correct":false},{"text":"Remove the service version","reason":"Version removal does not fix the envelope.","correct":false}],"takeaway":"This component supplies the SOAP envelope automatically.","sourceIds":["O-S-pagedsoap"]},{"id":"O014","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"A paged SOAP request must expose invalid reference information for investigation. Which setting is relevant?","options":[{"text":"Flatten Result on a REST step","reason":"A REST pagination setting cannot alter this SOAP response.","correct":false},{"text":"Generate Structure in Create JSON","reason":"This creates a JSON structure, not SOAP diagnostics.","correct":false},{"text":"App description","reason":"Descriptions do not control response elements.","correct":false},{"text":"Include Invalid Reference Responses","reason":"It makes Invalid_Reference_ID_Response available.","correct":true}],"takeaway":"It makes Invalid_Reference_ID_Response available.","sourceIds":["O-S-pagedsoap"]},{"id":"O015","topic":"soap-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"An external client calls a Workday SOAP service through the API Gateway. Which request configuration is appropriate?","options":[{"text":"PATCH with a CSV file","reason":"This is not the SOAP gateway request structure.","correct":false},{"text":"PUT with a report owner/name path","reason":"That describes neither this method nor this route.","correct":false},{"text":"POST with an XML SOAP envelope and Bearer authorization","reason":"The gateway route uses SOAP XML over an authenticated POST.","correct":true},{"text":"GET with a JSON object and no authorization","reason":"This is not the documented SOAP gateway call.","correct":false}],"takeaway":"The gateway route uses SOAP XML over an authenticated POST.","sourceIds":["O-S-soapgw"]},{"id":"O016","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"Which path shape identifies a SOAP service through the Workday API Gateway?","options":[{"text":"/reports/{owner}/{name}","reason":"This is not the documented gateway SOAP path.","correct":false},{"text":"/soap/{version}/{serviceName}","reason":"The gateway SOAP route includes version and service.","correct":true},{"text":"/wql/{version}/data","reason":"That route executes WQL queries.","correct":false},{"text":"/ccx/service/{tenant}/{service}","reason":"That is a tenanted service path, not this gateway path.","correct":false}],"takeaway":"The gateway SOAP route includes version and service.","sourceIds":["O-S-soapgw"]},{"id":"O017","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"A worker’s descriptor changes after a name correction. Which design avoids breaking the integration’s matching logic?","options":[{"text":"Use a stable supported ID; keep the descriptor for display","reason":"Descriptors are informational and can change.","correct":true},{"text":"Treat the descriptor as the immutable key","reason":"A changing descriptor is unsuitable as an identifier.","correct":false},{"text":"Match only the first name","reason":"First names are neither unique nor stable.","correct":false},{"text":"Remove every reference ID","reason":"That discards the reliable matching information.","correct":false}],"takeaway":"Descriptors are informational and can change.","sourceIds":["O-S-soapbest"]},{"id":"O018","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"multi","stem":"A supported service offers Put, Import, and Bulk Import. Which two considerations help choose appropriately?","options":[{"text":"Bulk Import suits large asynchronous batches","reason":"This fits many documents processed asynchronously.","correct":true},{"text":"Put is always best for the largest batch","reason":"The documented guidance distinguishes workload sizes.","correct":false},{"text":"Import eliminates validation requirements","reason":"Import operations still validate their requests.","correct":false},{"text":"Put suits small requests or individual documents","reason":"This fits a small transactional workload.","correct":true}],"takeaway":"This fits many documents processed asynchronously.","sourceIds":["O-S-soapbest"]},{"id":"O019","topic":"soap-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A SOAP validate-only test succeeds. What still requires care before treating the transaction as fully validated?","options":[{"text":"The header disables authentication","reason":"Security is not bypassed by this header.","correct":false},{"text":"Every import finishes in the initial response","reason":"Import processing can require separate status and message retrieval.","correct":false},{"text":"Custom and certain later-stage validations are not covered","reason":"Validate-only is not an exhaustive business validation guarantee.","correct":true},{"text":"The test has already persisted all changes","reason":"Validate-only avoids taking the action.","correct":false}],"takeaway":"Validate-only is not an exhaustive business validation guarantee.","sourceIds":["O-S-soapheaders"]},{"id":"O020","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"Which header is intended to correlate a SOAP request in Workday logs?","options":[{"text":"Accept-Language","reason":"It does not serve as the documented request identifier.","correct":false},{"text":"wd-external-request-id","reason":"It identifies the individual external request.","correct":true},{"text":"Content-Disposition","reason":"It describes content handling, not request correlation.","correct":false},{"text":"x-validate-only","reason":"It controls validation mode.","correct":false}],"takeaway":"It identifies the individual external request.","sourceIds":["O-S-soapheaders"]},{"id":"O021","topic":"soap-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A SOAP call returns HTTP 500 with Client.validationError and an invalid Employee_ID message. What is the best next action?","options":[{"text":"Inspect the SOAP fault and correct the ID/type combination","reason":"The response describes a request validation problem.","correct":true},{"text":"Retry indefinitely as a temporary server outage","reason":"HTTP 500 can accompany SOAP client validation faults.","correct":false},{"text":"Treat it as success because XML was returned","reason":"A fault is not a successful business response.","correct":false},{"text":"Increase the response page size","reason":"Paging does not repair an invalid reference.","correct":false}],"takeaway":"The response describes a request validation problem.","sourceIds":["O-S-soaperrors"]},{"id":"O022","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"A SOAP request fails with “Invalid request service version.” Which check directly follows from this fault?","options":[{"text":"Change all employee identifiers to descriptors","reason":"That does not fix a version string.","correct":false},{"text":"Remove domain security","reason":"Removing permissions cannot fix version syntax.","correct":false},{"text":"Ignore the fault and parse business data","reason":"The request did not produce a valid business response.","correct":false},{"text":"Check the supported version string, including its v prefix","reason":"The fault can result from invalid version syntax.","correct":true}],"takeaway":"The fault can result from invalid version syntax.","sourceIds":["O-S-soaperrors"]},{"id":"O023","topic":"soap-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"The endpoint specifies one WWS version and the XML request specifies another supported version. Which version takes precedence?","options":[{"text":"The newest version automatically","reason":"Explicit version selection is not silently replaced by latest.","correct":false},{"text":"Neither; all versions are ignored","reason":"Versions govern request and response formats.","correct":false},{"text":"The message version","reason":"Workday gives the request message version precedence.","correct":true},{"text":"The endpoint version in every case","reason":"The documented precedence is the reverse.","correct":false}],"takeaway":"Workday gives the request message version precedence.","sourceIds":["O-S-soapversions"]},{"id":"O024","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"A client needs the schema contract for a particular tenanted SOAP service version. Which approach is appropriate?","options":[{"text":"Change the report output to JSON","reason":"Report format does not retrieve a service WSDL.","correct":false},{"text":"Retrieve that versioned service endpoint with ?wsdl","reason":"This returns the corresponding WSDL contract.","correct":true},{"text":"Use a WQL alias as the service schema","reason":"WQL aliases identify query objects, not SOAP contracts.","correct":false},{"text":"Inspect only a CSV sample","reason":"A sample file does not define the SOAP schema.","correct":false}],"takeaway":"This returns the corresponding WSDL contract.","sourceIds":["O-S-soapversions"]},{"id":"O025","topic":"soap-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A multipage SOAP extract misses and duplicates workers while transactions continue. Which change addresses consistency?","options":[{"text":"Keep the same As_Of_Entry_DateTime across pages","reason":"A stable entry-time boundary prevents pages seeing different snapshots.","correct":true},{"text":"Use a fresh timestamp on every page","reason":"That permits the result population to shift.","correct":false},{"text":"Increase the page number without a stable boundary","reason":"Paging alone does not stabilize changing results.","correct":false},{"text":"Replace IDs with descriptors","reason":"Display labels cannot solve paging consistency.","correct":false}],"takeaway":"A stable entry-time boundary prevents pages seeing different snapshots.","sourceIds":["O-S-soapfilter"]},{"id":"O026","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"A SOAP extract needs fewer returned fields without changing its worker selection. Which request area is most relevant?","options":[{"text":"Request_References","reason":"It identifies particular entries to retrieve.","correct":false},{"text":"Request_Criteria","reason":"It selects categories of entries.","correct":false},{"text":"Page","reason":"It chooses a result page, not field inclusion.","correct":false},{"text":"Response_Group","reason":"It controls which fields are returned for each entry.","correct":true}],"takeaway":"It controls which fields are returned for each entry.","sourceIds":["O-S-soapfilter"]},{"id":"O027","topic":"soap-apis","group":"apis","difficulty":"Foundation","type":"single","stem":"An integration system has an assigned ISU and uses its default initiating-user API credential. Whose security normally applies?","options":[{"text":"Always an unrestricted administrator","reason":"Default credentials do not imply administrator access.","correct":false},{"text":"No user security applies","reason":"Workday authorizes the runtime account.","correct":false},{"text":"The assigned ISU","reason":"The integration runs under that assigned system user.","correct":true},{"text":"Always the developer who built the app","reason":"The author is not necessarily the runtime identity.","correct":false}],"takeaway":"The integration runs under that assigned system user.","sourceIds":["O-S-soapsecurity"]},{"id":"O028","topic":"soap-apis","group":"apis","difficulty":"Applied","type":"single","stem":"No ISU is configured on an integration system using the initiating-user default credential. Which account is used?","options":[{"text":"The vendor endpoint’s administrator","reason":"That external account does not define Workday authorization.","correct":false},{"text":"The user who launched the integration","reason":"Without an ISU, the initiating user supplies the runtime identity.","correct":true},{"text":"The last person who opened App Hub","reason":"Opening App Hub does not assign runtime security.","correct":false},{"text":"An automatically created unrestricted ISU","reason":"No such unrestricted user is implied.","correct":false}],"takeaway":"Without an ISU, the initiating user supplies the runtime identity.","sourceIds":["O-S-soapsecurity"]},{"id":"O029","topic":"wql","group":"apis","difficulty":"Advanced","type":"single","stem":"An orchestration uses WQL for an extract. Which statement about registering a separate API client is correct?","options":[{"text":"It is not required merely to use WQL inside the orchestration app","reason":"The documentation distinguishes app use from external-system registration.","correct":true},{"text":"It is always required for every WQL step","reason":"That overstates the external-client requirement.","correct":false},{"text":"WQL never needs an authenticated account","reason":"WQL still enforces account security.","correct":false},{"text":"Registration grants every data source","reason":"It does not remove data-access restrictions.","correct":false}],"takeaway":"The documentation distinguishes app use from external-system registration.","sourceIds":["O-S-wql"]},{"id":"O030","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A user can execute WQL but cannot query a restricted field. What explains this?","options":[{"text":"WQL bypasses report-field permissions","reason":"It only exposes authorized sources and fields.","correct":false},{"text":"Field aliases automatically grant access","reason":"Aliases are names, not permissions.","correct":false},{"text":"Changing the query to lowercase grants access","reason":"Case changes do not change authorization.","correct":false},{"text":"WQL access also depends on field and data-source security","reason":"Language access does not grant all underlying data.","correct":true}],"takeaway":"Language access does not grant all underlying data.","sourceIds":["O-S-wql"]},{"id":"O031","topic":"wql","group":"apis","difficulty":"Foundation","type":"single","stem":"A query has LIMIT 1200, while the REST request uses limit=200. Which interpretation is correct?","options":[{"text":"1200 rows per page","reason":"That confuses the query clause with the request parameter.","correct":false},{"text":"LIMIT and limit must have identical values","reason":"They serve different purposes.","correct":false},{"text":"Up to 1200 total rows, delivered in pages of 200","reason":"The clause caps the result; the parameter sizes each page.","correct":true},{"text":"Only 200 total rows can ever be retrieved","reason":"Further pages can retrieve the remaining result.","correct":false}],"takeaway":"The clause caps the result; the parameter sizes each page.","sourceIds":["O-S-wqlpaging"]},{"id":"O032","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A WQL page contains 250 rows starting at offset=0. Which offset starts the next nonoverlapping 250-row page?","options":[{"text":"500","reason":"That skips the second page.","correct":false},{"text":"250","reason":"Offset specifies the number of preceding rows.","correct":true},{"text":"1","reason":"That would overlap most of the first page.","correct":false},{"text":"249","reason":"That overlaps the last row of the first page.","correct":false}],"takeaway":"Offset specifies the number of preceding rows.","sourceIds":["O-S-wqlpaging"]},{"id":"O033","topic":"wql","group":"apis","difficulty":"Advanced","type":"single","stem":"A long WQL query is unsuitable for the documented GET URL length. Which supported alternative retains its read operation?","options":[{"text":"POST /data with the query in the body","reason":"POST can submit a longer query and still returns query results.","correct":true},{"text":"PUT /data to update all queried workers","reason":"WQL query execution is not a worker update.","correct":false},{"text":"DELETE /data to clear the request","reason":"Deleting is not the documented query alternative.","correct":false},{"text":"Store the query in an OAuth scope","reason":"Scopes are not query containers.","correct":false}],"takeaway":"POST can submit a longer query and still returns query results.","sourceIds":["O-S-wqlapi"]},{"id":"O034","topic":"wql","group":"apis","difficulty":"Applied","type":"multi","stem":"Before composing a WQL query, which two discovery calls help confirm available source and field metadata?","options":[{"text":"GET /dataSources/{ID}/fields","reason":"It describes fields for the selected source.","correct":true},{"text":"POST /workers to invent aliases","reason":"Creating a worker does not discover WQL fields.","correct":false},{"text":"DELETE /data to refresh names","reason":"There is no such discovery procedure.","correct":false},{"text":"GET /dataSources","reason":"It lists queryable data-source metadata.","correct":true}],"takeaway":"It describes fields for the selected source.","sourceIds":["O-S-wqlapi"]},{"id":"O035","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A query fails after a developer types a report label as a WQL field name. What should they verify?","options":[{"text":"The vendor’s file extension","reason":"An external filename does not identify WQL fields.","correct":false},{"text":"Whether every label has spaces removed","reason":"Guessing alias normalization is unreliable.","correct":false},{"text":"The field’s actual WQL alias","reason":"Display labels need not equal query aliases.","correct":true},{"text":"Only the report’s color theme","reason":"Presentation styling is irrelevant to field names.","correct":false}],"takeaway":"Display labels need not equal query aliases.","sourceIds":["O-S-alias"]},{"id":"O036","topic":"wql","group":"apis","difficulty":"Applied","type":"multi","stem":"Which objects can have aliases used in WQL queries? Select two.","options":[{"text":"Private OAuth tokens","reason":"Tokens authorize access; they are not query aliases.","correct":false},{"text":"Data-source filters and their parameters","reason":"WQL references these objects through aliases.","correct":true},{"text":"Fields and calculated fields","reason":"They have aliases used by query expressions.","correct":true},{"text":"Browser tabs","reason":"Browser UI labels are not query objects.","correct":false}],"takeaway":"WQL references these objects through aliases.","sourceIds":["O-S-alias"]},{"id":"O037","topic":"wql","group":"apis","difficulty":"Advanced","type":"single","stem":"A WQL filter should match either of two departments, but only for active workers. What avoids ambiguous logical grouping?","options":[{"text":"Parenthesize the department alternatives before AND active status","reason":"Parentheses make the intended evaluation explicit.","correct":true},{"text":"Remove all parentheses and rely on reading order","reason":"That can change the intended Boolean expression.","correct":false},{"text":"Move the active condition to SELECT","reason":"SELECT chooses fields, not row eligibility.","correct":false},{"text":"Use ORDER BY to remove inactive workers","reason":"Sorting does not filter rows.","correct":false}],"takeaway":"Parentheses make the intended evaluation explicit.","sourceIds":["O-S-where"]},{"id":"O038","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A WQL extract must return workers whose optional city field has no value. Which condition expresses that intent?","options":[{"text":"city = \"EMPTY\"","reason":"This compares against literal text.","correct":false},{"text":"ORDER BY city","reason":"Ordering does not select missing values.","correct":false},{"text":"LIMIT 0","reason":"This suppresses all rows rather than testing city.","correct":false},{"text":"city IS EMPTY, using the verified field alias","reason":"IS EMPTY tests the absence of a field value.","correct":true}],"takeaway":"IS EMPTY tests the absence of a field value.","sourceIds":["O-S-where"]},{"id":"O039","topic":"wql","group":"apis","difficulty":"Advanced","type":"single","stem":"A WQL SELECT includes related-object fields and the query needs a filter specific to those related fields. Which clause is designed for this?","options":[{"text":"ORDER BY","reason":"It changes sorting.","correct":false},{"text":"AS","reason":"It names an output column.","correct":false},{"text":"WHERE ON","reason":"It filters fields from related business objects in SELECT.","correct":true},{"text":"LIMIT","reason":"It caps result size.","correct":false}],"takeaway":"It filters fields from related business objects in SELECT.","sourceIds":["O-S-whereon"]},{"id":"O040","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A WQL query uses both related-object filtering and ordinary row filtering. Where must WHERE ON appear?","options":[{"text":"Only after LIMIT","reason":"That violates the documented order.","correct":false},{"text":"Before WHERE","reason":"The documented clause order requires this.","correct":true},{"text":"After HAVING in every query","reason":"That is not the supported placement.","correct":false},{"text":"Inside the OAuth header","reason":"It belongs in the query expression.","correct":false}],"takeaway":"The documented clause order requires this.","sourceIds":["O-S-whereon"]},{"id":"O041","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"An extract needs one summary row per location with a numeric total. Which clause defines the grouping dimension?","options":[{"text":"GROUP BY location","reason":"It combines rows sharing the location value.","correct":true},{"text":"ORDER BY location alone","reason":"Sorting leaves individual rows separate.","correct":false},{"text":"LIMIT location","reason":"LIMIT is not a grouping clause.","correct":false},{"text":"WHERE location IS NOT EMPTY alone","reason":"Filtering does not calculate grouped summaries.","correct":false}],"takeaway":"It combines rows sharing the location value.","sourceIds":["O-S-group"]},{"id":"O042","topic":"wql","group":"apis","difficulty":"Applied","type":"multi","stem":"Which two expressions are unsuitable as WQL GROUP BY keys under the documented restrictions?","options":[{"text":"A multi-instance field","reason":"WQL excludes multi-instance grouping fields.","correct":true},{"text":"A supported single-instance location field","reason":"A suitable ordinary field can define a grouping.","correct":false},{"text":"A supported text field","reason":"Text is not categorically excluded from grouping.","correct":false},{"text":"An aggregate expression such as SUM(amount)","reason":"Aggregated fields cannot themselves be grouping keys.","correct":true}],"takeaway":"WQL excludes multi-instance grouping fields.","sourceIds":["O-S-group"]},{"id":"O043","topic":"wql","group":"apis","difficulty":"Advanced","type":"single","stem":"A grouped WQL extract should retain only locations with more than 30 workers. Which condition belongs after GROUP BY?","options":[{"text":"LIMIT 30","reason":"It limits returned rows rather than group membership.","correct":false},{"text":"ORDER BY count() only","reason":"Sorting does not remove small groups.","correct":false},{"text":"HAVING count() > 30","reason":"HAVING filters the aggregated groups.","correct":true},{"text":"WHERE count() > 30 before grouping","reason":"That does not apply the required group filter.","correct":false}],"takeaway":"HAVING filters the aggregated groups.","sourceIds":["O-S-having"]},{"id":"O044","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A developer adds HAVING without grouping. Which change addresses the documented requirement?","options":[{"text":"Remove security checks","reason":"Permissions do not correct clause structure.","correct":false},{"text":"Use HAVING with GROUP BY","reason":"HAVING is defined for grouped or aggregate filtering with GROUP BY.","correct":true},{"text":"Move HAVING into the URL host","reason":"Query clauses do not belong in the hostname.","correct":false},{"text":"Rename it to ORDER BY","reason":"That changes filtering into sorting.","correct":false}],"takeaway":"HAVING is defined for grouped or aggregate filtering with GROUP BY.","sourceIds":["O-S-having"]},{"id":"O045","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A developer ports SELECT * from SQL to WQL. What must change?","options":[{"text":"List the required field aliases explicitly","reason":"WQL does not support SELECT *.","correct":true},{"text":"Replace * with the report owner","reason":"The owner is not a wildcard field list.","correct":false},{"text":"Change GET to DELETE","reason":"The HTTP method does not enable unsupported syntax.","correct":false},{"text":"Add a larger offset","reason":"Pagination does not fix the SELECT list.","correct":false}],"takeaway":"WQL does not support SELECT *.","sourceIds":["O-S-select"]},{"id":"O046","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A consumer requires a friendly JSON column name without renaming the Workday field. Which WQL feature fits?","options":[{"text":"An OAuth scope","reason":"Scopes authorize functional access.","correct":false},{"text":"A new security group","reason":"Security groups do not name response columns.","correct":false},{"text":"A SOAP envelope","reason":"This is a WQL query, not SOAP.","correct":false},{"text":"AS with a permitted output alias","reason":"It renames the response column.","correct":true}],"takeaway":"It renames the response column.","sourceIds":["O-S-select"]},{"id":"O047","topic":"wql","group":"apis","difficulty":"Advanced","type":"single","stem":"A team needs to extract from several tenants without migrating a custom report definition. Which approach is a suitable candidate?","options":[{"text":"Copy only a report’s browser bookmark","reason":"A URL does not create the report.","correct":false},{"text":"Use a descriptor as a tenant credential","reason":"Descriptors are not credentials.","correct":false},{"text":"WQL against each tenant’s available sources and security","reason":"The query can be reused without migrating a report.","correct":true},{"text":"RaaS without a report in the target tenant","reason":"RaaS depends on a report definition there.","correct":false}],"takeaway":"The query can be reused without migrating a report.","sourceIds":["O-S-compare"]},{"id":"O048","topic":"wql","group":"apis","difficulty":"Applied","type":"single","stem":"A team prioritizes a persisted report definition with Workday audit history for extract changes. Which approach best fits?","options":[{"text":"An untracked local CSV","reason":"The file does not capture report-definition changes.","correct":false},{"text":"RaaS from a managed custom report","reason":"The persisted definition participates in report auditing.","correct":true},{"text":"An unsaved WQL string alone","reason":"A query string alone is not an audited Workday report definition.","correct":false},{"text":"Only an HTTP timeout setting","reason":"Timeouts do not provide definition governance.","correct":false}],"takeaway":"The persisted definition participates in report auditing.","sourceIds":["O-S-compare"]},{"id":"O049","topic":"orchestration-build","group":"build","difficulty":"Foundation","type":"single","stem":"An integration app needs testing in a production-like tenant before production. Which promotion path fits its lifecycle?","options":[{"text":"Implementation, then Sandbox, then Production","reason":"These stages support progressive testing and release.","correct":true},{"text":"Production, then Implementation","reason":"That reverses the verification progression.","correct":false},{"text":"Sandbox directly to a local spreadsheet","reason":"A spreadsheet is not a promotion level.","correct":false},{"text":"Only rename the app to Production","reason":"Names do not promote an app.","correct":false}],"takeaway":"These stages support progressive testing and release.","sourceIds":["O-S-life"]},{"id":"O050","topic":"orchestration-build","group":"build","difficulty":"Advanced","type":"single","stem":"A developer saves new code but the production app still runs its current release. Why is this expected?","options":[{"text":"Production always runs unsaved local edits","reason":"Only the released app should run there.","correct":false},{"text":"An app cannot have multiple lifecycle levels","reason":"It is explicitly promoted through levels.","correct":false},{"text":"The browser must remain open to run the app","reason":"Runtime execution is not tied to that editor window.","correct":false},{"text":"Saving source and promoting a release are separate lifecycle actions","reason":"A source change is not automatically a production release.","correct":true}],"takeaway":"A source change is not automatically a production release.","sourceIds":["O-S-life"]},{"id":"O051","topic":"orchestration-build","group":"build","difficulty":"Applied","type":"multi","stem":"Which two responsibilities belong to App Hub?","options":[{"text":"Replacing every tenant security policy","reason":"App lifecycle services do not replace tenant authorization.","correct":false},{"text":"Acting as a vendor SFTP server","reason":"File transport is not its documented role.","correct":false},{"text":"Build and version management","reason":"App Hub manages source and build artifacts.","correct":true},{"text":"Supporting promotion and installation","reason":"It powers those lifecycle operations.","correct":true}],"takeaway":"App Hub manages source and build artifacts.","sourceIds":["O-S-hub"]},{"id":"O052","topic":"orchestration-build","group":"build","difficulty":"Applied","type":"single","stem":"Source was uploaded successfully, but the build failed. Which distinction explains why deployment artifacts may be unavailable?","options":[{"text":"Changing a worker report fixes every build","reason":"Data reports are unrelated to many source errors.","correct":false},{"text":"The build pipeline creates artifacts from source","reason":"Saving source is different from successfully compiling artifacts.","correct":true},{"text":"Every source upload is already a successful release","reason":"Build success is a separate requirement.","correct":false},{"text":"Artifacts are created only by sending email","reason":"That is not the App Hub pipeline.","correct":false}],"takeaway":"Saving source is different from successfully compiling artifacts.","sourceIds":["O-S-hub"]},{"id":"O053","topic":"orchestration-build","group":"build","difficulty":"Foundation","type":"single","stem":"An existing integration app ZIP is the approved starting point. Which creation option is appropriate?","options":[{"text":"Upload a Zip File","reason":"This creates the app from an existing packaged source.","correct":true},{"text":"Start from Scratch and ignore the ZIP","reason":"That discards the intended starting implementation.","correct":false},{"text":"Create a RaaS report","reason":"A report is not an integration app package.","correct":false},{"text":"Upload it as an OAuth token","reason":"Source packages are not authentication tokens.","correct":false}],"takeaway":"This creates the app from an existing packaged source.","sourceIds":["O-S-create"]},{"id":"O054","topic":"orchestration-build","group":"build","difficulty":"Advanced","type":"single","stem":"Which action checks schema, syntax, and semantic issues before saving an integration app?","options":[{"text":"Promote directly to Production","reason":"Promotion is not a substitute for validation.","correct":false},{"text":"Rename the reference ID randomly","reason":"Renaming does not perform validation.","correct":false},{"text":"Export a screenshot","reason":"A screenshot cannot validate source.","correct":false},{"text":"Validate","reason":"The app validation action detects these build problems.","correct":true}],"takeaway":"The app validation action detects these build problems.","sourceIds":["O-S-create"]},{"id":"O055","topic":"orchestration-build","group":"build","difficulty":"Applied","type":"single","stem":"A scheduled tenant integration system must launch the workflow and track its event. Which orchestration template fits?","options":[{"text":"Create JSON","reason":"This is a component rather than a launch template.","correct":false},{"text":"Text Template","reason":"This renders documents rather than defining that trigger.","correct":false},{"text":"Workday Integration System", s a numeric value, but 700 was entered as a String pill. What is the best correction?","options":[{"text":"Append every available function","reason":"Functions must match the desired type and behavior.","correct":false},{"text":"Ignore type errors until Production","reason":"Validation should be resolved before release.","correct":false},{"text":"Choose the numeric literal or a suitable conversion","reason":"Expression Builder distinguishes text from numbers.","correct":true},{"text":"Change only the pill’s visible label","reason":"A label does not change its type.","correct":false}],"takeaway":"Expression Builder distinguishes text from numbers.","sourceIds":["O-S-expr"]},{"id":"O064","topic":"expressions","group":"build","difficulty":"Applied","type":"single","stem":"An Advanced Mode edit makes an expression invalid. Which action restores the last valid expression?","options":[{"text":"Refresh the API response","reason":"Response data does not undo expression editing.","correct":false},{"text":"Revert","reason":"Advanced Mode provides Revert for invalid edits.","correct":true},{"text":"Promote","reason":"Promotion does not repair expression syntax.","correct":false},{"text":"Change tenant time zone","reason":"The time zone does not restore code.","correct":false}],"takeaway":"Advanced Mode provides Revert for invalid edits.","sourceIds":["O-S-expr"]},{"id":"O065","topic":"expressions","group":"build","difficulty":"Applied","type":"single","stem":"A value is allowed only when both approval and budget checks pass. Which condition combination should be selected?","options":[{"text":"All conditions must be met","reason":"This applies logical AND.","correct":true},{"text":"One condition must be met","reason":"OR would allow only one check to pass.","correct":false},{"text":"Always use the false output","reason":"That rejects even valid combinations.","correct":false},{"text":"Remove both checks","reason":"That removes the required control.","correct":false}],"takeaway":"This applies logical AND.","sourceIds":["O-S-conditions"]},{"id":"O066","topic":"expressions","group":"build","difficulty":"Advanced","type":"single","stem":"Either a manager override or a standard eligibility check may authorize processing. Which combination matches?","options":[{"text":"All conditions must be met","reason":"AND unnecessarily requires both.","correct":false},{"text":"Compare the names of the conditions","reason":"Names do not represent their Boolean results.","correct":false},{"text":"Always return true","reason":"That also permits neither condition to pass.","correct":false},{"text":"One condition must be met","reason":"Logical OR permits either successful condition.","correct":true}],"takeaway":"Logical OR permits either successful condition.","sourceIds":["O-S-conditions"]},{"id":"O067","topic":"expressions","group":"build","difficulty":"Applied","type":"single","stem":"An upstream payload is stored as text but contains valid XML. What is needed before XPath extraction?","options":[{"text":"Change the filename only","reason":"Filename changes do not change the data type.","correct":false},{"text":"Run JSONPath directly","reason":"JSONPath targets JSON, not XML.","correct":false},{"text":"Cast it to XML","reason":"XPath functions operate on XML objects.","correct":true},{"text":"Cast it to a Boolean","reason":"A Boolean has no XML structure.","correct":false}],"takeaway":"XPath functions operate on XML objects.","sourceIds":["O-S-xpath"]},{"id":"O068","topic":"expressions","group":"build","difficulty":"Advanced","type":"single","stem":"A downstream step needs an XML subtree, not a leaf value. Which accessor is suitable?","options":[{"text":"An HTTP response status accessor","reason":"Status codes do not identify XML fragments.","correct":false},{"text":"fragmentAtXPath","reason":"It can return an XML fragment.","correct":true},{"text":"A leaf string accessor in every case","reason":"Most typed XPath accessors expect leaf values.","correct":fals stem":"Within nested each or with blocks, what does this reference?","options":[{"text":"Always the original document root","reason":"Inner blocks change the nearest context.","correct":false},{"text":"Always the current tenant","reason":"It is a template value reference.","correct":false},{"text":"The app’s security group","reason":"It does not represent authorization.","correct":false},{"text":"The nearest in-scope with value or each item","reason":"Nested context determines this.","correct":true}],"takeaway":"Nested context determines this.","sourceIds":["O-S-templates"]},{"id":"O075","topic":"expressions","group":"build","difficulty":"Foundation","type":"single","stem":"An integration repeatedly combines first and last names for later steps. Which component centralizes that derived value?","options":[{"text":"Promote App","reason":"Promotion does not calculate a name.","correct":false},{"text":"Continue on Conditions","reason":"That controls continuation rather than creating the derived value.","correct":false},{"text":"Create Values","reason":"It creates named values reusable downstream.","correct":true},{"text":"Send Paged SOAP Call","reason":"That retrieves data rather than defining this calculation.","correct":false}],"takeaway":"It creates named values reusable downstream.","sourceIds":["O-S-values"]},{"id":"O076","topic":"expressions","group":"build","difficulty":"Applied","type":"single","stem":"Several expensive Create Values expressions are independent; others depend on earlier values. Which arrangement helps performance?","options":[{"text":"Remove all types and validation","reason":"Correctness remains necessary.","correct":false},{"text":"Separate independent expressions from dependent chains","reason":"Independent pairs can be processed in parallel.","correct":true},{"text":"Make each independent expression depend on all others","reason":"Artificial dependencies force sequential work.","correct":false},{"text":"Convert every value to an image","reason":"That does not improve evaluation.","correct":false}],"takeaway":"Independent pairs can be processed in parallel.","sourceIds":["O-S-values"]},{"id":"O077","topic":"expressions","group":"build","difficulty":"Applied","type":"single","stem":"A target JSON contract is available as a sample. Which Create JSON option can establish its initial structure?","options":[{"text":"Generate Structure from the sample","reason":"It accepts pasted JSON or an uploaded JSON file.","correct":true},{"text":"Use the sample as an OAuth secret","reason":"Payload structure is not a credential.","correct":false},{"text":"Rename the file to .xml","reason":"Renaming does not construct the required JSON.","correct":false},{"text":"Promote the sample directly","reason":"A payload sample is not a deployable app.","correct":false}],"takeaway":"It accepts pasted JSON or an uploaded JSON file.","sourceIds":["O-S-json"]},{"id":"O078","topic":"expressions","group":"build","difficulty":"Advanced","type":"single","stem":"A downstream endpoint expects active as a Boolean and amount as a Number. What should the JSON mapping preserve?","options":[{"text":"Quote every value as a String","reason":"That changes the expected JSON types.","correct":false},{"text":"Replace every field with its label","reason":"Labels do not supply the required values.","correct":false},{"text":"Remove the root structure","reason":"That would break the expected payload.","correct":false},{"text":"The corresponding Boolean and Number types","reason":"Typed values should match the contract.","correct":true}],"takeaway":"Typed values should match the contract.","sourceIds":["O-S-json"]},{"id":"O079","topic":"expressions","group":"build","difficulty":"Foundation","type":"single","stem":"An optional launch parameter should override configuration only when it has a value. Which check matches this requirement?","options":[{"text":"The app’s promotion level","reason":"Lifecycle state does not indicate input presence.","correct":fal ssion uses mapLookupWithDefault, but the integration map itself does not exist. What is expected?","options":[{"text":"The map is created automatically","reason":"Lookup does not provision configuration.","correct":false},{"text":"All entries are returned","reason":"This function is a lookup, not enumeration.","correct":false},{"text":"Security is disabled for the lookup","reason":"A default does not bypass configuration or security.","correct":false},{"text":"An exception can still occur","reason":"The fallback covers a missing key, not a missing map.","correct":true}],"takeaway":"The fallback covers a missing key, not a missing map.","sourceIds":["O-S-intsys"]},{"id":"O083","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"Two IF branches evaluate to true. Which one runs in Branch on Conditions?","options":[{"text":"Only the last true branch","reason":"The first true branch wins.","correct":false},{"text":"The ELSE branch","reason":"ELSE is used when preceding conditions do not match.","correct":false},{"text":"Only the first true branch from left to right","reason":"Branch order determines the selected path.","correct":true},{"text":"Both true branches always run","reason":"This is selection, not parallel fan-out.","correct":false}],"takeaway":"Branch order determines the selected path.","sourceIds":["O-S-branch"]},{"id":"O084","topic":"flow","group":"build","difficulty":"Advanced","type":"multi","stem":"Downstream processing needs one value from whichever branch executes. Which two settings are necessary?","options":[{"text":"Run every branch simultaneously","reason":"Branch outputs do not require fan-out.","correct":false},{"text":"Enable outputs","reason":"This exposes branch output to later steps.","correct":true},{"text":"Use the same output type across branches","reason":"The branch result needs a consistent type.","correct":true},{"text":"Give every branch a different incompatible output type","reason":"That prevents consistent downstream typing.","correct":false}],"takeaway":"This exposes branch output to later steps.","sourceIds":["O-S-branch"]},{"id":"O085","topic":"flow","group":"build","difficulty":"Foundation","type":"single","stem":"No eligible records remain and the orchestration should stop with a clear message. Which component fits that guard?","options":[{"text":"Continue on Conditions","reason":"A false assertion stops processing and logs its message.","correct":true},{"text":"Create JSON","reason":"Creating a payload does not itself stop the flow.","correct":false},{"text":"Store Document","reason":"Saving output does not implement this guard.","correct":false},{"text":"Loop sorting","reason":"Sorting does not stop an empty or ineligible workflow.","correct":false}],"takeaway":"A false assertion stops processing and logs its message.","sourceIds":["O-S-continue"]},{"id":"O086","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"A Continue on Conditions assertion evaluates to true. What happens next?","options":[{"text":"It always throws a validation exception","reason":"False, rather than true, triggers its stop behavior.","correct":false},{"text":"All earlier API changes are rolled back","reason":"The component does not imply a global transaction.","correct":false},{"text":"Its message must always be logged as failure","reason":"The false assertion triggers the configured stop message.","correct":false},{"text":"The orchestration continues","reason":"True is the condition for continuing.","correct":true}],"takeaway":"True is the condition for continuing.","sourceIds":["O-S-continue"]},{"id":"O087","topic":"flow","group":"build","difficulty":"Advanced","type":"single","stem":"A loop should process only eligible records. Which input setting avoids admitting the others into its processing block?","options":[{"text":"App description","reason":"Documentation text does not evaluate eligibility.","correct":false},{"text":"Promotion level","reason":"Lifecycl
