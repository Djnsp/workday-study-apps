e state does not select records.","correct":false},{"text":"Filter","reason":"It narrows the dataset entering the loop.","correct":true},{"text":"Output filename","reason":"A filename does not filter loop items.","correct":false}],"takeaway":"It narrows the dataset entering the loop.","sourceIds":["O-S-loop"]},{"id":"O088","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"Amounts stored as strings sort as 100, 20, 3. How should a numeric sort be designed?","options":[{"text":"Increase API page size","reason":"Page size does not change value comparison.","correct":false},{"text":"Make the Sort By expression yield a Number","reason":"Numbers sort numerically; text sorts lexicographically.","correct":true},{"text":"Keep String type and rename the field Amount","reason":"A field name does not change sorting semantics.","correct":false},{"text":"Reverse the string sort only","reason":"Reversal still does not produce numeric ordering.","correct":false}],"takeaway":"Numbers sort numerically; text sorts lexicographically.","sourceIds":["O-S-loop"]},{"id":"O089","topic":"flow","group":"build","difficulty":"Foundation","type":"single","stem":"A vendor accepts at most 40 records in each payload. Which batching strategy fits that constraint?","options":[{"text":"Size with a breakpoint of 40","reason":"It creates batches based on record count.","correct":true},{"text":"Group by worker name","reason":"That groups by values rather than the maximum count.","correct":false},{"text":"Sort by employee ID alone","reason":"Sorting does not create bounded batches.","correct":false},{"text":"Join all records to themselves","reason":"Joining does not enforce payload size.","correct":false}],"takeaway":"It creates batches based on record count.","sourceIds":["O-S-batch"]},{"id":"O090","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"Records from three countries are interleaved, and each country needs a separate batch. Which Batch Loop strategy fits?","options":[{"text":"Size using the number of countries","reason":"Fixed-size chunks need not align with countries.","correct":false},{"text":"Custom breakpoint after every tenth record","reason":"Arbitrary boundaries do not identify country groups.","correct":false},{"text":"Sort each batch only","reason":"Sorting does not itself establish the grouping.","correct":false},{"text":"Group using the country value","reason":"Grouping gathers records by the selected key.","correct":true}],"takeaway":"Grouping gathers records by the selected key.","sourceIds":["O-S-batch"]},{"id":"O091","topic":"flow","group":"build","difficulty":"Advanced","type":"single","stem":"Workers must be enriched with cost-center data from a second dataset. Which component matches records using a common key?","options":[{"text":"Create Text Template alone","reason":"Rendering does not automatically define a keyed join.","correct":false},{"text":"Send Paged REST Call alone","reason":"Retrieval does not join separate datasets.","correct":false},{"text":"Join Loop","reason":"It joins a primary dataset to matching secondary records.","correct":true},{"text":"Continue on Conditions","reason":"It guards execution without matching datasets.","correct":false}],"takeaway":"It joins a primary dataset to matching secondary records.","sourceIds":["O-S-join"]},{"id":"O092","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"A worker has no match in a lookup dataset, but must still enter the loop for an exception report. Which missing-match strategy fits?","options":[{"text":"Use Last","reason":"That is a multiple-match strategy, not missing-match handling.","correct":false},{"text":"Alternate Processing","reason":"It passes the record through and allows missing-data checks.","correct":true},{"text":"Skip Record","reason":"That omits the worker from the loop block.","correct":false},{"text":"Complete with Error","reason":"That stops processing rather than producing the alternate record.","correct":false}],"takeaway":"It passes the record through and allows missing-data checks.","sourceIds":["O-S-join"]},{"id":"O093","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"A loop creates a JSON object per worker. The next API expects one array. Which aggregation fits?","options":[{"text":"JSON Fold","reason":"It combines JSON fragments into a JSON array.","correct":true},{"text":"Count","reason":"It returns a count, not the worker objects.","correct":false},{"text":"Maximum","reason":"It chooses a numeric maximum.","correct":false},{"text":"String Map","reason":"It produces keyed strings, not the required object array.","correct":false}],"takeaway":"It combines JSON fragments into a JSON array.","sourceIds":["O-S-aggregate"]},{"id":"O094","topic":"flow","group":"build","difficulty":"Advanced","type":"single","stem":"A loop processes 12 records, but only 9 meet an aggregation condition. What does Count aggregate?","options":[{"text":"All 12 regardless of condition","reason":"Nonqualifying items are excluded.","correct":false},{"text":"The number of API pages","reason":"This counts aggregated items, not pages.","correct":false},{"text":"The number of fields in each record","reason":"Field count is unrelated to the condition.","correct":false},{"text":"The 9 qualifying items","reason":"Aggregation conditions control inclusion.","correct":true}],"takeaway":"Aggregation conditions control inclusion.","sourceIds":["O-S-aggregate"]},{"id":"O095","topic":"flow","group":"build","difficulty":"Advanced","type":"single","stem":"A loop should stop once it finds a qualifying record, and later logic must know it stopped early. Which output serves this?","options":[{"text":"Max Pages","reason":"That configures pagination, not loop completion.","correct":false},{"text":"Content Type","reason":"It identifies data format.","correct":false},{"text":"did.Stop.Early","reason":"It indicates termination caused by the early-stop condition.","correct":true},{"text":"allValid","reason":"That is a Validate output.","correct":false}],"takeaway":"It indicates termination caused by the early-stop condition.","sourceIds":["O-S-stop"]},{"id":"O096","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"A loop needs deterministic sequential early-stop processing. What tradeoff accompanies Force Sequential Processing?","options":[{"text":"It automatically commits a database transaction","reason":"The option does not create global transactional behavior.","correct":false},{"text":"It can increase processing time and timeout risk","reason":"Parallel work is replaced with ordered processing.","correct":true},{"text":"It guarantees the shortest runtime","reason":"Sequential execution can be slower.","correct":false},{"text":"It removes every API rate limit","reason":"Ordering does not change endpoint limits.","correct":false}],"takeaway":"Parallel work is replaced with ordered processing.","sourceIds":["O-S-stop"]},{"id":"O097","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"A Validate step reports an error, yet the next API call still runs. What explains this?","options":[{"text":"Validation does not automatically stop the orchestration","reason":"Its outputs need explicit downstream control when stopping is required.","correct":true},{"text":"The API must ignore all validation messages","reason":"The flow design, not the endpoint, governs continuation.","correct":false},{"text":"Every error message automatically rolls back prior steps","reason":"Logging an error does not imply rollback.","correct":false},{"text":"Validate is only a design-time button","reason":"The runtime component produces validation outputs.","correct":false}],"takeaway":"Its outputs need explicit downstream control when stopping is required.","sourceIds":["O-S-validate"]},{"id":"O098","topic":"flow","group":"build","difficulty":"Applied","type":"single","stem":"A summary file should list every failed runtime validation. Which output is designed for iteration?","options":[{"text":"allValid","reason":"It is a Boolean, not a list of failures.","correct":false},{"text":"anyError","reason":"It indicates whether an error exists.","correct":false},{"text":"anyWarning","reason":"It indicates whether a warning exists.","correct":false},{"text":"failedValidations","reason":"It exposes failed validation name, severity, and summary.","correct":true}],"takeaway":"It exposes failed validation name, severity, and summary.","sourceIds":["O-S-validate"]},{"id":"O099","topic":"rest-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A RaaS step declares JSON Content Type but the report still responds in another format. Which configuration controls the server response format?","options":[{"text":"The app’s description","reason":"Descriptions do not change report output.","correct":false},{"text":"The retry count","reason":"Retries repeat the request without changing format.","correct":false},{"text":"The format query parameter","reason":"The component’s Content Type alone does not request the report format.","correct":true},{"text":"The step’s reference name","reason":"Names do not select server serialization.","correct":false}],"takeaway":"The component’s Content Type alone does not request the report format.","sourceIds":["O-S-raas"]},{"id":"O100","topic":"rest-apis","group":"apis","difficulty":"Advanced","type":"single","stem":"A developer tries to place Send Workday RaaS Request inside a Join Loop. Which documented restriction matters?","options":[{"text":"Every RaaS request must be anonymous","reason":"It uses configured authentication.","correct":false},{"text":"The RaaS component cannot be used in Join Loops","reason":"The component reference explicitly excludes that placement.","correct":true},{"text":"RaaS never works in Integration System orchestrations","reason":"That template is supported.","correct":false},{"text":"RaaS can only return images","reason":"Its output supports report data formats.","correct":false}],"takeaway":"The component reference explicitly excludes that placement.","sourceIds":["O-S-raas"]},{"id":"A001","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A REST GET succeeds for an administrator but returns forbidden for the orchestration user. Which permission should you investigate first?","options":[{"text":"Report/Task View on the endpoint domains","correct":true,"reason":"REST reads use View permissions on relevant domains."},{"text":"Get permission alone on every domain","correct":false,"reason":"SOAP-style Get does not replace REST View."},{"text":"Modify on unrelated domains","correct":false,"reason":"Unrelated write access cannot authorize this read."},{"text":"Developer Site company administrator role","correct":false,"reason":"Developer administration does not grant tenant data access."}],"takeaway":"Check the API-specific domains and effective runtime identity.","sourceIds":["A-S01"]},{"id":"A002","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A business-process orchestration switches to explicit ISU authentication. What requires particular review?","options":[{"text":"Whether all tenant security checks disappear","correct":false,"reason":"Domain authorization still applies to the ISU."},{"text":"Whether the response automatically becomes anonymous","correct":false,"reason":"The ISU remains an authenticated identity."},{"text":"Whether encryption replaces authorization","correct":false,"reason":"Encryption does not decide who may access records."},{"text":"Whether ISU access exposes data beyond the initiating user’s rights","correct":true,"reason":"ISU permissions can differ from end-user permissions."}],"takeaway":"Treat explicit ISU authentication as a deliberate security design decision.","sourceIds":["A-S01"]},{"id":"A003","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A new integration app must call Workday as a system identity. Which setup sequence is appropriate?","options":[{"text":"Create credentials before any ISU exists","correct":false,"reason":"ISU authentication depends on an existing account."},{"text":"Promote the app and assume administrator rights","correct":false,"reason":"Promotion does not provision unrestricted runtime access."},{"text":"Create ISU, assign it to the app, configure orchestration credentials","correct":true,"reason":"These establish the identity, association, and runtime credential."},{"text":"Create a log message and use its title as credentials","correct":false,"reason":"Logs do not establish authentication."}],"takeaway":"Configure the identity before using it in request steps.","sourceIds":["A-S02"]},{"id":"A004","topic":"orchestration-security","group":"reuse-security","difficulty":"Advanced","type":"multi","stem":"The team asks what App Manager contributes to app ISU authentication. Which two capabilities apply? Select two answers.","options":[{"text":"Make every employee an integration administrator","correct":false,"reason":"App identity setup does not grant employee roles."},{"text":"Assign an ISU to the app","correct":true,"reason":"This connects the system identity to the app."},{"text":"Create an API client for that ISU","correct":true,"reason":"The setup supports the app’s authenticated API use."},{"text":"Replace all endpoint domain policies","correct":false,"reason":"Authorization policies remain necessary."}],"takeaway":"App association and API-client setup complement tenant security.","sourceIds":["A-S02"]},{"id":"A005","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An app reads REST resources and invokes SOAP updates. Which security combination should its ISSG receive as required?","options":[{"text":"REST View/Modify and SOAP Get/Put on relevant domains","correct":true,"reason":"The permission families differ by API interface."},{"text":"Only REST View for every operation","correct":false,"reason":"Read access cannot authorize SOAP writes."},{"text":"Only SOAP Get for every operation","correct":false,"reason":"Read-only SOAP access cannot cover the mixed workload."},{"text":"Developer role without tenant permissions","correct":false,"reason":"Builder roles do not replace tenant domain access."}],"takeaway":"Match permissions to the actual read and write operations.","sourceIds":["A-S03"]},{"id":"A006","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An administrator edits the app ISU security-group permissions, but the new access is not active. Which task belongs in the setup?","options":[{"text":"Rename the orchestration","correct":false,"reason":"Names do not activate security changes."},{"text":"Increase HTTP retries","correct":false,"reason":"Repeated requests do not activate permissions."},{"text":"Convert the response to XML","correct":false,"reason":"Payload representation does not grant access."},{"text":"Activate Pending Security Policy Changes","correct":true,"reason":"Edited policies must be activated."}],"takeaway":"Include policy activation when deploying security changes.","sourceIds":["A-S03"]},{"id":"A007","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An administrator cannot see Add Integration System User in App Manager. What should they check?","options":[{"text":"The HTTP response content type","correct":false,"reason":"Response parsing does not enable administrative buttons."},{"text":"The suborchestration output names","correct":false,"reason":"Outputs do not grant assignment privileges."},{"text":"Modify access to WCP Integration System User Security","correct":true,"reason":"That domain enables the assignment control."},{"text":"The CSV separator character","correct":false,"reason":"File delimiters do not control App Manager actions."}],"takeaway":"Administrative configuration has its own security requirements.","sourceIds":["A-S04"]},{"id":"A008","topic":"orchestration-security","group":"reuse-security","difficulty":"Advanced","type":"single","stem":"An app is deployed and an ISU is assigned in App Manager. What creates the generated API client for that association?","options":[{"text":"Change the app’s display description","correct":false,"reason":"Display text does not provision credentials."},{"text":"Create API Client on the ISU row","correct":true,"reason":"App Manager provides this action after assignment."},{"text":"Store Document with the ISU name","correct":false,"reason":"Document storage does not register API clients."},{"text":"Add Integration Message with severity INFO","correct":false,"reason":"Messages do not create authentication clients."}],"takeaway":"Assigning an identity and creating its client are distinct steps.","sourceIds":["A-S04"]},{"id":"A009","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An outbound API requires OAuth in production. Which credential option does Workday recommend?","options":[{"text":"Cred Store Reference","correct":true,"reason":"The documented production recommendation uses the credential store."},{"text":"A permanent token embedded in every step","correct":false,"reason":"Duplicated literal tokens complicate controlled rotation."},{"text":"The integration-event filename as bearer token","correct":false,"reason":"A filename is not an OAuth credential."},{"text":"No credentials after promotion","correct":false,"reason":"Promotion does not authenticate external requests."}],"takeaway":"Reference managed credentials instead of duplicating secret values.","sourceIds":["A-S05"]},{"id":"A010","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"multi","stem":"An external endpoint expects an API key in a header. Which two settings are relevant when creating the credential? Select two answers.","options":[{"text":"Header as the placement","correct":true,"reason":"Placement must match the endpoint’s contract."},{"text":"The report owner’s display name","correct":false,"reason":"This is unrelated to API-key placement."},{"text":"A CSV quote character","correct":false,"reason":"CSV parsing does not configure authentication headers."},{"text":"The key and its value","correct":true,"reason":"These define the API-key pair."}],"takeaway":"Match the credential type and placement to the endpoint.","sourceIds":["A-S05"]},{"id":"A011","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An external service requires client-certificate authentication from Orchestrate. Which setup fits?","options":[{"text":"A PGP signature alone","correct":false,"reason":"PGP signing does not perform the TLS handshake."},{"text":"A custom report security group alone","correct":false,"reason":"Tenant authorization cannot authenticate the external TLS connection."},{"text":"Integration CredStore plus a Mutual Auth configuration","correct":true,"reason":"The configuration references managed TLS credentials."},{"text":"A certificate copied into a CSV column","correct":false,"reason":"Payload fields do not establish TLS authentication."}],"takeaway":"Use mutual TLS configuration for outbound certificate authentication.","sourceIds":["A-S06"]},{"id":"A012","topic":"orchestration-security","group":"reuse-security","difficulty":"Advanced","type":"single","stem":"Only one Send HTTP Request step requires a particular mutual TLS configuration. What can you do?","options":[{"text":"Disable server authentication globally","correct":false,"reason":"That removes a required security check."},{"text":"Select that configuration on the individual request step","correct":true,"reason":"The configuration can apply to a specific step."},{"text":"Apply it to every app in the account","correct":false,"reason":"A single endpoint does not require account-wide changes."},{"text":"Put the private key in the URL","correct":false,"reason":"A URL does not safely configure mutual TLS."}],"takeaway":"Use the narrowest appropriate TLS configuration scope.","sourceIds":["A-S06"]},{"id":"A013","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A payroll file must remain encrypted after transfer to external storage. Which Orchestrate feature addresses payload encryption?","options":[{"text":"PGP configuration referenced by Data functions","correct":true,"reason":"PGP encrypts the document itself."},{"text":"A longer HTTP timeout","correct":false,"reason":"Timeouts do not encrypt stored files."},{"text":"A different document title","correct":false,"reason":"Renaming does not protect content."},{"text":"An INFO integration message","correct":false,"reason":"Logging does not encrypt the payload."}],"takeaway":"Payload encryption and transport security serve different purposes.","sourceIds":["A-S07"]},{"id":"A014","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"Where should PGP material be managed before referencing it from Orchestration Builder?","options":[{"text":"The text of every runtime log","correct":false,"reason":"Logs are not a credential store."},{"text":"A worker’s public profile field","correct":false,"reason":"Profile data is not designed for secret management."},{"text":"A launch parameter containing the private key","correct":false,"reason":"Passing secret material as ordinary input is inappropriate."},{"text":"An Integration CredStore on the tenant","correct":true,"reason":"Builder refers to the configured credential identifier."}],"takeaway":"Separate key management from orchestration processing logic.","sourceIds":["A-S07"]},{"id":"A015","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A server requires client certificates and uses a CA absent from Workday’s default truststore. Which token type fits?","options":[{"text":"JKS_KEYSTORE using default trust only","correct":false,"reason":"The server also requires a custom trust chain."},{"text":"A CSV format definition","correct":false,"reason":"File schema settings do not configure TLS."},{"text":"JKS_KEYSTORE_TRUSTSTORE","correct":true,"reason":"It combines client credentials with custom server trust."},{"text":"JKS_TRUSTSTORE alone","correct":false,"reason":"It does not provide the client private key."}],"takeaway":"Client identity and server trust may need separate material.","sourceIds":["A-S08"]},{"id":"A016","topic":"orchestration-security","group":"reuse-security","difficulty":"Advanced","type":"single","stem":"A server needs no client certificate, but its CA is not trusted by default. Which configuration is appropriate?","options":[{"text":"An unrestricted ISSG","correct":false,"reason":"Tenant data privileges do not repair TLS trust."},{"text":"JKS_TRUSTSTORE containing the trusted CA certificates","correct":true,"reason":"A custom truststore supports server-certificate validation."},{"text":"A client private key without trusted certificates","correct":false,"reason":"Client identity does not establish server trust."},{"text":"A PGP public key","correct":false,"reason":"PGP keys are not TLS CA certificates."}],"takeaway":"Diagnose certificate trust separately from tenant authorization.","sourceIds":["A-S08"]},{"id":"A017","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"An orchestration must authenticate Send HTTP Request to an AWS service with Signature v4. Which settings matter?","options":[{"text":"AWS credentials, target region, and service","correct":true,"reason":"Signature configuration identifies credentials and request destination."},{"text":"Only a document tag","correct":false,"reason":"Tags do not sign AWS requests."},{"text":"Only the Workday report owner","correct":false,"reason":"Workday report ownership does not authenticate to AWS."},{"text":"Only the CSV header names","correct":false,"reason":"File columns are unrelated to request signing."}],"takeaway":"Configure AWS authentication for the actual target service.","sourceIds":["A-S09"]},{"id":"A018","topic":"orchestration-security","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A team is preparing a production AWS integration. Which credential design aligns with the documented managed setup?","options":[{"text":"Use the development-only temporary-token option","correct":false,"reason":"Do not assume development options apply to production."},{"text":"Log the secret key for every request","correct":false,"reason":"Logs must not become a secret distribution channel."},{"text":"Replace signing with the app’s description","correct":false,"reason":"A description cannot authenticate the request."},{"text":"Reference an AWS Access Key CredStore","correct":true,"reason":"This uses the tenant-managed credential route."}],"takeaway":"Use the supported credential route for the deployment environment.","sourceIds":["A-S09"]},{"id":"A019","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A child workflow cannot read a value created in its parent. What is the correct repair?","options":[{"text":"Assume every parent output is globally visible","correct":false,"reason":"Parent outputs are not automatically shared."},{"text":"Move the value into a runtime log","correct":false,"reason":"Logs are not the suborchestration input interface."},{"text":"Declare an input and pass the value explicitly","correct":true,"reason":"Suborchestrations receive only explicitly passed parent values."},{"text":"Rename the child to match the parent","correct":false,"reason":"Naming does not expand data scope."}],"takeaway":"Make data dependencies explicit at workflow boundaries.","sourceIds":["A-S11"]},{"id":"A020","topic":"reuse","group":"reuse-security","difficulty":"Advanced","type":"single","stem":"A child computes a normalized worker record, but the parent cannot consume it. What should you configure?","options":[{"text":"An unrelated integration attribute","correct":false,"reason":"An unrelated attribute does not return the computed record."},{"text":"An End-step output returning the record","correct":true,"reason":"Only explicitly returned values are available to the caller."},{"text":"A longer name for the child","correct":false,"reason":"Names do not expose internal values."},{"text":"A parent reference to any internal child step","correct":false,"reason":"Internal step outputs are not implicitly public."}],"takeaway":"Return the smallest useful result through a typed interface.","sourceIds":["A-S11"]},{"id":"A021","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A developer imports an orchestration from another app. Later, the original changes. What happens to the imported copy?","options":[{"text":"It remains an independent copy","correct":true,"reason":"Imported orchestrations are not linked to their originals."},{"text":"It updates automatically on every original save","correct":false,"reason":"Import does not establish a live dependency."},{"text":"It becomes read-only forever","correct":false,"reason":"The imported copy can be modified."},{"text":"It disappears when the original is renamed","correct":false,"reason":"The copy has independent ownership in its app."}],"takeaway":"Plan maintenance deliberately when reusing copied workflows.","sourceIds":["A-S12"]},{"id":"A022","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An imported orchestration calls several suborchestrations. What does the import operation include?","options":[{"text":"Only the parent’s display name","correct":false,"reason":"The operation imports workflow content."},{"text":"Every orchestration in every account","correct":false,"reason":"The selected source app bounds the import."},{"text":"A live cross-app execution link","correct":false,"reason":"Imported objects are separate copies."},{"text":"Its associated suborchestrations","correct":true,"reason":"The documented import includes those dependencies."}],"takeaway":"Verify imported dependencies and configuration before testing.","sourceIds":["A-S12"]},{"id":"A023","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A reusable child must start after an external system has had time to index data. Where does a configured launch delay apply?","options":[{"text":"Before every step in every app","correct":false,"reason":"Its scope is the configured invocation."},{"text":"Only after the parent has completed","correct":false,"reason":"The parent needs the child during its flow."},{"text":"Before the suborchestration invocation starts","correct":true,"reason":"The delay precedes execution of the child."},{"text":"After the child has returned all outputs","correct":false,"reason":"The documented delay is not post-processing."}],"takeaway":"A launch delay postpones child execution, not returned results.","sourceIds":["A-S13"]},{"id":"A024","topic":"reuse","group":"reuse-security","difficulty":"Advanced","type":"multi","stem":"Which two statements describe a Call Suborchestration step? Select two answers.","options":[{"text":"It requires copying every child step into the parent","correct":false,"reason":"The call is intended to reuse the separate workflow."},{"text":"It supplies values for the child’s input keys","correct":true,"reason":"The call maps the declared interface."},{"text":"It targets a suborchestration in the same app","correct":true,"reason":"The component uses app-local suborchestrations."},{"text":"It exposes all child internals automatically","correct":false,"reason":"Only declared outputs cross the boundary."}],"takeaway":"Call a defined interface instead of duplicating implementation.","sourceIds":["A-S13"]},{"id":"A025","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"Two integration-system orchestrations in one app need shared validation. Which component family fits?","options":[{"text":"Suborchestration calling components","correct":true,"reason":"They invoke reusable logic within the app."},{"text":"Document storage components alone","correct":false,"reason":"Storage does not execute shared validation logic."},{"text":"Log components alone","correct":false,"reason":"Logging records information without providing a reusable workflow."},{"text":"A report header field","correct":false,"reason":"Report formatting is not workflow invocation."}],"takeaway":"Use app-local suborchestrations for reusable processing.","sourceIds":["A-S14"]},{"id":"A026","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A team expects Call Suborchestration to execute a workflow located only in an unrelated app. What should be corrected?","options":[{"text":"Make the unrelated app title identical","correct":false,"reason":"Matching labels does not change component scope."},{"text":"Add the other app’s name to a CSV header","correct":false,"reason":"Payload text does not define an execution target."},{"text":"Increase the retry interval","correct":false,"reason":"Retries cannot change the workflow’s app boundary."},{"text":"Provide the reusable workflow within the calling app","correct":true,"reason":"The call component targets same-app suborchestrations."}],"takeaway":"Check reuse scope before wiring a call.","sourceIds":["A-S14"]},{"id":"A027","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"Sandbox and production need different non-secret service URLs with the same logic. Which feature fits?","options":[{"text":"Use the integration-event completion timestamp","correct":false,"reason":"A timestamp cannot express the service URL."},{"text":"Create different CSV headers per tenant","correct":false,"reason":"Headers do not provide application configuration."},{"text":"Tenant-specific integration app attributes","correct":true,"reason":"Runtime values can vary without duplicating processing logic."},{"text":"Hard-code production in every expression","correct":false,"reason":"This makes environment changes error-prone."}],"takeaway":"Separate environment configuration from reusable orchestration logic.","sourceIds":["A-S15"]},{"id":"A028","topic":"reuse","group":"reuse-security","difficulty":"Advanced","type":"single","stem":"An orchestration needs an app attribute’s value for its current tenant environment. Which predefined variable is relevant?","options":[{"text":"A hard-coded worker ID","correct":false,"reason":"A worker identifier is not an attribute accessor."},{"text":"attrstore","correct":true,"reason":"It exposes configured application attributes."},{"text":"processingError","correct":false,"reason":"It represents error context rather than app configuration."},{"text":"documents","correct":false,"reason":"It accesses integration-event documents."}],"takeaway":"Read app configuration through the app-attribute mechanism.","sourceIds":["A-S15"]},{"id":"A029","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A newly added Console app attribute is not ready for editing in App Manager. What configuration step is needed?","options":[{"text":"Update App Configuration for the app","correct":true,"reason":"This refreshes the attributes available for assignment."},{"text":"Change every integration-event filename","correct":false,"reason":"File names do not refresh attribute definitions."},{"text":"Delete all runtime logs","correct":false,"reason":"Log removal does not update app configuration."},{"text":"Add a SOAP header with the attribute name","correct":false,"reason":"Headers do not synchronize attribute definitions."}],"takeaway":"Refresh app configuration after changing attribute definitions.","sourceIds":["A-S16"]},{"id":"A030","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An attribute should use different values in sandbox and production. Which approach fits?","options":[{"text":"Expect the sandbox value to transfer automatically","correct":false,"reason":"The documentation requires separate environment assignment."},{"text":"Leave environment blank and expect different values","correct":false,"reason":"A blank environment applies the value across environments."},{"text":"Change only the attribute’s display order","correct":false,"reason":"Display order does not determine runtime values."},{"text":"Assign values separately for the applicable environments","correct":true,"reason":"Attribute values are environment-specific assignments."}],"takeaway":"Verify each environment’s configuration before promotion testing.","sourceIds":["A-S16"]},{"id":"A031","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An integration uses a custom report that is not referenced by its integration system. What must migration account for?","options":[{"text":"Rename the target tenant to match","correct":false,"reason":"Names do not migrate dependent reports."},{"text":"Add the report name to a runtime log","correct":false,"reason":"Logging a name does not create a report."},{"text":"Migrate the report separately or in a configuration package","correct":true,"reason":"Unreferenced tenant components require separate handling."},{"text":"Assume integration-system migration includes every tenant object","correct":false,"reason":"Migration scope is not the entire tenant."}],"takeaway":"Inventory tenant dependencies before migration.","sourceIds":["A-S17"]},{"id":"A032","topic":"reuse","group":"reuse-security","difficulty":"Advanced","type":"single","stem":"An integration app must move to a different developer account. Which source-transfer approach is documented?","options":[{"text":"Export a single API response as the app","correct":false,"reason":"Runtime data is not the application package."},{"text":"Download Source ZIP and upload it when creating the target app","correct":true,"reason":"This transfers application source between accounts."},{"text":"Copy only the last integration-event status","correct":false,"reason":"Status does not contain application source."},{"text":"Change the original account’s display name","correct":false,"reason":"Renaming does not transfer an app."}],"takeaway":"Move application source and tenant configuration through their respective routes.","sourceIds":["A-S17"]},{"id":"A033","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A team wants a reusable package of tenant configuration for an integration app. What should it contain?","options":[{"text":"Selected implementation-type instances and their dependencies","correct":true,"reason":"Configuration packages represent tenant configuration objects."},{"text":"Only screenshots of configuration screens","correct":false,"reason":"Screenshots cannot install tenant objects."},{"text":"Only the latest external API response","correct":false,"reason":"Runtime data is not configuration metadata."},{"text":"Every worker’s password","correct":false,"reason":"Credentials are not an appropriate configuration inventory."}],"takeaway":"Package the tenant objects required by the app.","sourceIds":["A-S18"]},{"id":"A034","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"A configuration package uses condition rules to select instances. A matching instance is created later. What is expected at migration?","options":[{"text":"The package can include only objects existing at rule creation","correct":false,"reason":"The documented filtering can include later matching instances."},{"text":"The rule becomes a runtime API credential","correct":false,"reason":"Selection rules are not authentication material."},{"text":"The app automatically creates unrelated objects","correct":false,"reason":"Only matching configuration is in scope."},{"text":"Matching instances are included when the filtered package is installed","correct":true,"reason":"Selection evaluates the configured criteria for migration."}],"takeaway":"Understand whether migration selection is rule-based or fixed.","sourceIds":["A-S18"]},{"id":"A035","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An app has a prepared reusable tenant package. Which route associates it with the app?","options":[{"text":"Create a runtime INFO message","correct":false,"reason":"Messages do not attach configuration packages."},{"text":"Rename an existing suborchestration","correct":false,"reason":"Workflow names do not link tenant packages."},{"text":"Add Tenant Configuration and complete Object Transporter steps","correct":true,"reason":"The workflow links the package through Customer Central."},{"text":"Paste the package name into a CSV file","correct":false,"reason":"Text does not establish the configuration association."}],"takeaway":"Attach configuration through the app’s supported packaging workflow.","sourceIds":["A-S19"]},{"id":"A036","topic":"reuse","group":"reuse-security","difficulty":"Advanced","type":"single","stem":"After adding a tenant configuration to an app, what should the developer verify on the Developer Site?","options":[{"text":"Delete the source package immediately","correct":false,"reason":"Deletion is unnecessary and undermines traceability."},{"text":"Refresh the app page and confirm the package association","correct":true,"reason":"The documented workflow includes verifying the association."},{"text":"Assume every target tenant is already configured","correct":false,"reason":"Association is distinct from installation on targets."},{"text":"Assume all user passwords were copied","correct":false,"reason":"The workflow does not imply secret migration."}],"takeaway":"Confirm the app includes its intended reusable configuration.","sourceIds":["A-S19"]},{"id":"A037","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"single","stem":"An app with an associated package is installed on a new tenant. How is the tenant configuration installed?","options":[{"text":"Use Configure, Install Configuration, and Object Transporter","correct":true,"reason":"The target configuration has its own installation workflow."},{"text":"Assume opening the app installs every object","correct":false,"reason":"Opening the app does not perform the documented migration."},{"text":"Upload the package title as a report output","correct":false,"reason":"An output file does not install configuration."},{"text":"Run an arbitrary outbound API call","correct":false,"reason":"Data requests do not migrate tenant packages."}],"takeaway":"App installation and configuration migration are separate checks.","sourceIds":["A-S20"]},{"id":"A038","topic":"reuse","group":"reuse-security","difficulty":"Applied","type":"multi","stem":"Which two prerequisites matter before installing an app’s configuration on another tenant? Select two answers.","options":[{"text":"Appropriate Object Transporter permissions","correct":true,"reason":"Configuration installation uses the migration workflow."},{"text":"All API endpoints must be public","correct":false,"reason":"Tenant configuration does not require public endpoints."},{"text":"Every report must be deleted first","correct":false,"reason":"Deleting reports is not a prerequisite."},{"text":"The app is promoted to the desired tenant","correct":true,"reason":"The documented workflow starts with app availability."}],"takeaway":"Prepare both app availability and migration authorization.","sourceIds":["A-S20"]},{"id":"A039","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A vendor requires semicolon-delimited output with column names. Which CSV-format settings address the contract?","options":[{"text":"Use the default separator without checking","correct":false,"reason":"The default comma would violate this contract."},{"text":"Remove all quote characters from data","correct":false,"reason":"That can corrupt fields containing structural characters."},{"text":"Set Separator Character and enable Header Row","correct":true,"reason":"These control delimiters and the column-name row."},{"text":"Change only the document title","correct":false,"reason":"The title does not change serialization."}],"takeaway":"Treat the vendor’s file format as an explicit contract.","sourceIds":["A-S21"]},{"id":"A040","topic":"inbound-orchestration","group":"io","difficulty":"Advanced","type":"single","stem":"An inbound CSV contains a comma inside a quoted address. Which settings should match the sender’s format?","options":[{"text":"Only the sender’s display name","correct":false,"reason":"Identity labels do not define CSV syntax."},{"text":"Separator and quote characters","correct":true,"reason":"The parser must distinguish delimiters from quoted content."},{"text":"Only the integration-event severity","correct":false,"reason":"Severity has no effect on parsing."},{"text":"Only the document retention period","correct":false,"reason":"Retention does not identify field boundaries."}],"takeaway":"Parse CSV with its defined structure instead of splitting raw text.","sourceIds":["A-S21"]},{"id":"A041","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A workflow has a stored document’s collection and entry ID and needs its bytes. Which component fits?","options":[{"text":"Retrieve Document","correct":true,"reason":"It retrieves one document using those identifiers."},{"text":"Find Documents using a filename only","correct":false,"reason":"Find Documents searches grouped reference IDs."},{"text":"Create Text Template with the entry ID","correct":false,"reason":"This produces text, not the stored document."},{"text":"Add Integration Message","correct":false,"reason":"It writes a message rather than retrieving content."}],"takeaway":"Use the stored-document identifier pair to retrieve content.","sourceIds":["A-S22"]},{"id":"A042","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A stored file must later be sent to an external API. What does Retrieve Document provide on success?","options":[{"text":"Only the application source ZIP","correct":false,"reason":"Application source is unrelated to this stored file."},{"text":"A new user security group","correct":false,"reason":"Retrieval does not provision authorization."},{"text":"An automatic vendor acknowledgement","correct":false,"reason":"Retrieving a file does not transmit it externally."},{"text":"The document content and filename","correct":true,"reason":"These outputs can feed later transmission steps."}],"takeaway":"Retrieval supplies content; delivery remains a separate action.","sourceIds":["A-S22"]},{"id":"A043","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A batch contains several documents sharing one reference ID, but their entry IDs are unknown. Which component should discover them?","options":[{"text":"Create Values containing the batch label","correct":false,"reason":"A label alone does not query stored metadata."},{"text":"Log to File","correct":false,"reason":"It creates log output rather than discovering documents."},{"text":"Find Documents","correct":true,"reason":"It locates documents sharing the reference identifier."},{"text":"Retrieve Document with a guessed entry ID","correct":false,"reason":"Retrieval requires the actual identifier."}],"takeaway":"Group by reference ID when later batch discovery is required.","sourceIds":["A-S23"]},{"id":"A044","topic":"inbound-orchestration","group":"io","difficulty":"Advanced","type":"multi","stem":"Find Documents returns metadata for many files. Which two fields support later Retrieve Document calls? Select two answers.","options":[{"text":"Only the MIME type","correct":false,"reason":"Many documents share a content type."},{"text":"collection","correct":true,"reason":"Retrieval needs the storage collection."},{"text":"entryId","correct":true,"reason":"Retrieval needs the individual document identifier."},{"text":"Only the file size","correct":false,"reason":"Size does not uniquely locate stored content."}],"takeaway":"Use returned identifiers rather than inferring document locations.","sourceIds":["A-S23"]},{"id":"A045","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"Store Document succeeds, but users cannot see the file attached to the integration event. Which setting should you inspect?","options":[{"text":"Attach document to integration event","correct":true,"reason":"Association alone does not enable attachment by default."},{"text":"The HTTP method of an unrelated API","correct":false,"reason":"That does not control event attachment."},{"text":"The report owner’s timezone","correct":false,"reason":"That does not determine attachment visibility."},{"text":"A larger CSV escape character","correct":false,"reason":"Escape characters do not attach documents."}],"takeaway":"Distinguish storing, associating, attaching, and delivering a document.","sourceIds":["A-S24"]},{"id":"A046","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A stored output should use the integration event’s configured delivery services. Which configuration is relevant?","options":[{"text":"Only give the document a vendor name","correct":false,"reason":"A title does not configure routing."},{"text":"Only set a storage expiration","correct":false,"reason":"Retention does not initiate delivery."},{"text":"Only add a debug message","correct":false,"reason":"A log entry does not send the output."},{"text":"Associate the event and select delivery from its services","correct":true,"reason":"The option uses the associated event’s delivery configuration."}],"takeaway":"Explicitly connect stored output to the required delivery route.","sourceIds":["A-S24"]},{"id":"A047","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"An event contains input and audit files. You need only documents with both required labels. Which filter fits?","options":[{"text":"No filter, then get the first document","correct":false,"reason":"Ordering alone does not identify the intended input."},{"text":"Sort by filename only","correct":false,"reason":"Sorting changes order, not label eligibility."},{"text":"documents.labels with the required label list","correct":true,"reason":"This matches all specified labels."},{"text":"documents.labelsMatchAny with that list","correct":false,"reason":"Any-match could include files missing one required label."}],"takeaway":"Choose all-match versus any-match document filters deliberately.","sourceIds":["A-S25"]},{"id":"A048","topic":"inbound-orchestration","group":"io","difficulty":"Advanced","type":"single","stem":"After filtering event documents, a developer calls get() and assumes every matching document was processed. What is wrong?","options":[{"text":"Document filters apply only to filenames","correct":false,"reason":"Label and other filters are also available."},{"text":"get() returns the first match; use an iterator for all","correct":true,"reason":"A single-document accessor does not process the whole set."},{"text":"Filtering automatically executes every downstream step per file","correct":false,"reason":"Filtering does not create looping behavior."},{"text":"get() always returns the last matching file","correct":false,"reason":"The documented no-argument form returns the first."}],"takeaway":"Separate document selection from iteration over the selected set.","sourceIds":["A-S25"]},{"id":"A049","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"An incoming document is CSV, but later steps need named CSV fields. Which operation prepares the appropriate typed view?","options":[{"text":"asCSV with the configured schema reference","correct":true,"reason":"It treats the data as CSV with the chosen format."},{"text":"asJSON regardless of the content","correct":false,"reason":"JSON interpretation does not parse CSV correctly."},{"text":"base64encode alone","correct":false,"reason":"Encoding changes representation, not CSV structure."},{"text":"Rename the filename to .json","correct":false,"reason":"An extension does not transform content."}],"takeaway":"Choose the parser that matches the actual payload format.","sourceIds":["A-S26"]},{"id":"A050","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"An outbound document must be encrypted for the recipient and signed by the sender. Which Data operation fits?","options":[{"text":"base64encode only","correct":false,"reason":"Base64 provides encoding, not secrecy or a signature."},{"text":"pgpDecrypt with the recipient public key","correct":false,"reason":"Decryption is not the requested outbound operation."},{"text":"createSHA256 without any signing key","correct":false,"reason":"A digest alone is not a sender-authenticated signature."},{"text":"pgpSignAndEncrypt with recipient public key and sender signing key","correct":true,"reason":"Encryption and signing use different key roles."}],"takeaway":"Keep recipient encryption and sender signing roles distinct.","sourceIds":["A-S26"]},{"id":"A051","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A CSV amount is blank in an optional numeric column. Which accessor can supply a configured fallback?","options":[{"text":"booleanColumnValue","correct":false,"reason":"A Boolean accessor is wrong for an amount."},{"text":"allColumnsAreEmpty as the amount","correct":false,"reason":"That yields a Boolean row check, not the number."},{"text":"numberColumnValueWithDefault","correct":true,"reason":"It supports a default when the column has no value."},{"text":"columnValue with no fallback logic","correct":false,"reason":"It returns text rather than providing this numeric default."}],"takeaway":"Use a typed fallback that matches the field’s semantics.","sourceIds":["A-S27"]},{"id":"A052","topic":"inbound-orchestration","group":"io","difficulty":"Advanced","type":"single","stem":"A numeric CSV field contains \"unknown\". Why can numberColumnValueWithDefault still fail?","options":[{"text":"The function always returns a string","correct":false,"reason":"This is a numeric accessor."},{"text":"A default for missing data does not fix invalid numeric text","correct":true,"reason":"Conversion errors can still throw exceptions."},{"text":"Every default accessor silently changes text to zero","correct":false,"reason":"The documented behavior does not promise coercion."},{"text":"A default makes the entire schema optional","correct":false,"reason":"Column/schema validity remains relevant."}],"takeaway":"Distinguish missing values from malformed values during validation.","sourceIds":["A-S27"]},{"id":"A053","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A CSV export requires reordered columns without rewriting the whole file manually. Which Csv operation is designed for this?","options":[{"text":"convert with the desired column ordering","correct":true,"reason":"It constructs CSV with selected or rearranged columns."},{"text":"countRows","correct":false,"reason":"A row count does not reorder columns."},{"text":"headerRow alone","correct":false,"reason":"Reading the header does not restructure the document."},{"text":"Log to File without mapping","correct":false,"reason":"Logging does not automatically implement the vendor’s layout."}],"takeaway":"Use structured CSV transformation for column-layout changes.","sourceIds":["A-S28"]},{"id":"A054","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A CSV has a defined header row. The workflow must process data rows without treating the header as a worker. Which iterator fits?","options":[{"text":"headerRow()","correct":false,"reason":"That selects the header rather than data rows."},{"text":"countColumns()","correct":false,"reason":"That returns a count instead of row data."},{"text":"An unparsed text split with no header handling","correct":false,"reason":"It can process the header as an ordinary record."},{"text":"rows()","correct":true,"reason":"The documented rows iterator excludes the defined header."}],"takeaway":"Respect header semantics when iterating structured files.","sourceIds":["A-S28"]},{"id":"A055","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"An HTTP request returns an error status, yet the orchestration continues. Which configuration can explicitly classify successful responses?","options":[{"text":"A different document title","correct":false,"reason":"Document names cannot change HTTP handling."},{"text":"A longer connection timeout alone","correct":false,"reason":"Timeouts do not classify received status codes."},{"text":"A custom HTTP retry policy with success ranges","correct":true,"reason":"Defined success ranges support failure classification."},{"text":"An INFO log statement alone","correct":false,"reason":"Logging does not classify the response as failed."}],"takeaway":"Do not assume every unsuccessful HTTP response automatically fails the run.","sourceIds":["A-S29"]},{"id":"A056","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"A retry policy has two condition sets, each containing two conditions. How are conditions evaluated?","options":[{"text":"Only the last condition is evaluated","correct":false,"reason":"The policy evaluates the configured sets."},{"text":"All within a set; any matching set can trigger retry","correct":true,"reason":"Sets combine internally with AND and externally with OR."},{"text":"Any condition in any set is always sufficient","correct":false,"reason":"That ignores within-set conjunction."},{"text":"Every condition in every set must be true","correct":false,"reason":"That incorrectly combines separate sets with AND."}],"takeaway":"Model retry conditions with the correct logical grouping.","sourceIds":["A-S29"]},{"id":"A057","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"An external export returns a job ID and completes later. Which design checks completion before downstream processing?","options":[{"text":"HTTP polling on the external status request","correct":true,"reason":"Polling waits for the defined completion conditions."},{"text":"Repeatedly submit new export jobs","correct":false,"reason":"Resubmission may create duplicate jobs."},{"text":"Use the first acceptance response as final data","correct":false,"reason":"Acceptance does not establish completion."},{"text":"Use Workday SOAP pagination against the vendor","correct":false,"reason":"Pagination is not external-job status polling."}],"takeaway":"Poll job status instead of repeating the creation request.","sourceIds":["A-S30"]},{"id":"A058","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A polling configuration has HTTP 200 and status=\"complete\" as stop conditions. When does it stop successfully?","options":[{"text":"As soon as HTTP 200 appears","correct":false,"reason":"Transport success alone may mean still processing."},{"text":"Whenever either condition matches","correct":false,"reason":"The documented stop-condition combination is AND."},{"text":"Only after an unrelated upstream step changes","correct":false,"reason":"Polling evaluates its configured response conditions."},{"text":"When both conditions match","correct":true,"reason":"Multiple stop conditions must all be satisfied."}],"takeaway":"Combine transport and business completion checks.","sourceIds":["A-S30"]},{"id":"A059","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A failed step has Conditional Outputs handling. Downstream logic reads its normal response unconditionally and fails again. What should change?","options":[{"text":"Remove all branching","correct":false,"reason":"That leaves the invalid output access unconditional."},{"text":"Log the missing response before checking","correct":false,"reason":"Logging still attempts to access the unavailable output."},{"text":"Guard access with isSuccess","correct":true,"reason":"Failed-step primary outputs must be accessed conditionally."},{"text":"Rename the response variable only","correct":false,"reason":"A different name does not make failed output available."}],"takeaway":"Branch on the handler’s success indicator before consuming normal output.","sourceIds":["A-S31"]},{"id":"A060","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"An error handler must log context and then let a higher-level handler decide recovery. Which option fits?","options":[{"text":"Set a filename to \"failed\"","correct":false,"reason":"A label does not rethrow an exception."},{"text":"Propagate Error","correct":true,"reason":"It executes handler steps and rethrows to a parent/global handler."},{"text":"Conditional Outputs used as unconditional success","correct":false,"reason":"That does not express the requested propagation."},{"text":"Delete the failed step’s logs","correct":false,"reason":"Removing evidence does not propagate errors."}],"takeaway":"Choose deliberately between local recovery and error propagation.","sourceIds":["A-S31"]},{"id":"A061","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A handler needs the qualified identifier of the failing step. Which ProcessingError function fits?","options":[{"text":"locationPath()","correct":true,"reason":"It returns the qualified step identifier."},{"text":"locationId() when the full qualified path is required","correct":false,"reason":"That returns the step ID rather than its qualified path."},{"text":"A document title","correct":false,"reason":"Document labels do not identify the error location."},{"text":"A launch-parameter timestamp","correct":false,"reason":"Time does not identify the failing step path."}],"takeaway":"Use structured location metadata for precise diagnosis.","sourceIds":["A-S32"]},{"id":"A062","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A developer branches on the exact wording of processingError.rawMessage(). Why is this fragile?","options":[{"text":"The function always contains a worker ID","correct":false,"reason":"Its purpose is the underlying error message."},{"text":"The function changes every error into success","correct":false,"reason":"Reading a message does not handle an error."},{"text":"Messages automatically grant recovery permissions","correct":false,"reason":"Text does not authorize corrective operations."},{"text":"Error messages are provided for logging, not logical control","correct":true,"reason":"The reference explicitly warns against using their contents as logic."}],"takeaway":"Prefer stable status and typed outputs to error-text matching.","sourceIds":["A-S32"]},{"id":"A063","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"Saving to App Hub fails before any tenant run occurs. Where should the developer begin?","options":[{"text":"The vendor’s SFTP archive only","correct":false,"reason":"It cannot explain a local build failure."},{"text":"A successful run from an older version only","correct":false,"reason":"That may not represent the current build."},{"text":"Build Logs","correct":true,"reason":"These describe compilation during save/build."},{"text":"Only run-time API response logs","correct":false,"reason":"No tenant execution has occurred yet."}],"takeaway":"Distinguish compilation failures from runtime failures.","sourceIds":["A-S33"]},{"id":"A064","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"multi","stem":"A deployed run fails at an external request. Which two log details help connect symptoms to the request? Select two answers.","options":[{"text":"Only a CSV column count","correct":false,"reason":"It does not describe the HTTP result."},{"text":"The response code","correct":true,"reason":"It identifies the HTTP result."},{"text":"The orchestration step name","correct":true,"reason":"It locates the request within the workflow."},{"text":"Only the app’s marketing title","correct":false,"reason":"That does not identify a failing operation."}],"takeaway":"Correlate runtime evidence with the step that produced it.","sourceIds":["A-S33"]},{"id":"A065","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A developer starts debugging midway through a workflow without running preceding steps. What may be required?","options":[{"text":"Supply the selected step’s inputs manually","correct":true,"reason":"Earlier execution has not supplied the needed values."},{"text":"Assume inputs are copied from every tenant automatically","correct":false,"reason":"Debugging does not infer arbitrary tenant state."},{"text":"Delete the input definitions","correct":false,"reason":"The step still needs its required inputs."},{"text":"Replace all inputs with empty strings","correct":false,"reason":"That can invalidate the intended test."}],"takeaway":"A meaningful debug run needs representative input values.","sourceIds":["A-S34"]},{"id":"A066","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A new Integration System orchestration cannot yet provide recent run context for debugging. What prerequisite should be checked?","options":[{"text":"Create a public anonymous endpoint","correct":false,"reason":"Public access is not the required prerequisite."},{"text":"Remove all launch parameters permanently","correct":false,"reason":"That changes the workflow instead of providing context."},{"text":"Rename every step to Start","correct":false,"reason":"Names do not generate run context."},{"text":"Deploy the app and run it at least once","correct":true,"reason":"This template needs a tenant run before debugging."}],"takeaway":"Establish tenant execution context before debugging integration-system workflows.","sourceIds":["A-S34"]},{"id":"A067","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"Only one intermittent step needs extra diagnostic detail for the next run. Which verbose-logging controls fit?","options":[{"text":"Only a new document title","correct":false,"reason":"Titles do not configure verbose logging."},{"text":"A permanent log of every secret","correct":false,"reason":"That is unnecessary and exposes sensitive information."},{"text":"stepFilter and oneTimeOnly","correct":true,"reason":"These constrain the captured steps and logging lifetime."},{"text":"Only an unlimited retry policy","correct":false,"reason":"Retries do not choose diagnostic capture scope."}],"takeaway":"Scope diagnostic logging to the investigation.","sourceIds":["A-S35"]},{"id":"A068","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"A verbose-logging response reports disposed=true for a oneTimeOnly configuration. What does this indicate?","options":[{"text":"All future orchestrations are disabled","correct":false,"reason":"One-time logging does not disable execution."},{"text":"The one-time logging configuration has been used","correct":true,"reason":"This field records consumption of one-time logging."},{"text":"The application source has been deleted","correct":false,"reason":"Logging disposal does not delete the app."},{"text":"The tenant has been decommissioned","correct":false,"reason":"The field is about this logging configuration."}],"takeaway":"Interpret diagnostic status fields within their own scope.","sourceIds":["A-S35"]},{"id":"A069","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"An orchestration should emit a runtime message only when a record fails a validation check. Which Log property fits?","options":[{"text":"Condition","correct":true,"reason":"It controls whether the message is logged."},{"text":"Document expiration","correct":false,"reason":"Retention does not control a Log step’s condition."},{"text":"Application Reference ID","correct":false,"reason":"App identity does not express the validation predicate."},{"text":"API credential name","correct":false,"reason":"Authentication configuration does not select logging cases."}],"takeaway":"Use conditional logging to capture actionable exceptions.","sourceIds":["A-S36"]},{"id":"A070","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A developer adds a Log step and expects a CSV attachment automatically. What is the correct distinction?","options":[{"text":"Every Log always creates a CSV attachment","correct":false,"reason":"The component’s purpose is runtime message logging."},{"text":"Log can only run before deployment","correct":false,"reason":"Messages are recorded during execution."},{"text":"Log replaces every integration-event message","correct":false,"reason":"The logging destinations have separate purposes."},{"text":"Log writes its message at runtime","correct":true,"reason":"A CSV artifact requires an appropriate file-logging/storage path."}],"takeaway":"Choose logging components according to the intended audience and destination.","sourceIds":["A-S36"]},{"id":"A071","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"Operators need a downloadable CSV of row-level processing issues. Which component directly fits?","options":[{"text":"Create Values alone","correct":false,"reason":"In-memory values do not create the operator’s log file."},{"text":"Rename the orchestration","correct":false,"reason":"Names do not collect row-level results."},{"text":"Log to File","correct":true,"reason":"It stores structured log content as a CSV document."},{"text":"Log alone","correct":false,"reason":"A runtime message is not the requested CSV artifact."}],"takeaway":"Use structured file logs when operators need a reviewable artifact.","sourceIds":["A-S37"]},{"id":"A072","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"After an unhandled failure, duplicate log attachments appear. What documented behavior could explain this?","options":[{"text":"The file separator caused a second integration launch","correct":false,"reason":"CSV formatting does not trigger launches."},{"text":"Named logs are automatically stored again on unhandled failure","correct":true,"reason":"Duplicate attachments do not prove duplicate step execution."},{"text":"Every step necessarily executed twice","correct":false,"reason":"Repeated attachments alone cannot establish that."},{"text":"The app automatically duplicated all source code","correct":false,"reason":"Runtime logging does not copy the app."}],"takeaway":"Investigate execution evidence before concluding duplicate processing occurred.","sourceIds":["A-S37"]},{"id":"A073","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A team wants to compare slow steps across several orchestration runs. Which feature fits?","options":[{"text":"Orchestration Summary Report","correct":true,"reason":"It summarizes execution counts and performance statistics."},{"text":"A single document filename","correct":false,"reason":"A name does not measure step performance."},{"text":"Only the app attribute list","correct":false,"reason":"Configuration values do not show execution timings."},{"text":"Only the latest CSV header","correct":false,"reason":"The header is not a performance summary."}],"takeaway":"Use aggregate run evidence when optimizing performance.","sourceIds":["A-S38"]},{"id":"A074","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A very broad orchestration summary report fails because its scope produces excessive output. What is a sensible next step?","options":[{"text":"Grant every user administrator permissions","correct":false,"reason":"Authorization expansion does not reduce report size."},{"text":"Delete the orchestration immediately","correct":false,"reason":"A large report is not proof the workflow is unusable."},{"text":"Change the report filename only","correct":false,"reason":"A label does not reduce the selected data."},{"text":"Reduce the number of runs and generate the report again","correct":true,"reason":"The documentation recommends narrowing oversized reports."}],"takeaway":"Narrow diagnostic scope while preserving representative runs.","sourceIds":["A-S38"]},{"id":"A075","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"A child integration’s processing has finished, but its parent callback is still waiting. What should be examined?","options":[{"text":"Only the source app’s display name","correct":false,"reason":"Names do not indicate workflow completion."},{"text":"Only the last successful compilation","correct":false,"reason":"Build success does not establish runtime completion."},{"text":"Remaining steps in the child Integration Business Process","correct":true,"reason":"Callback completion waits for that process to complete."},{"text":"Only whether a response file exists","correct":false,"reason":"A file does not prove every process step completed."}],"takeaway":"Check the complete integration process, including retrieval and delivery steps.","sourceIds":["A-S39"]},{"id":"A076","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Advanced","type":"single","stem":"A support analyst needs a sequential view of configured business-process steps. Which object is most relevant?","options":[{"text":"Only an app attribute’s value","correct":false,"reason":"Configuration alone does not show executed steps."},{"text":"Integration Process Event","correct":true,"reason":"It shows the business-process execution sequence."},{"text":"Only the app source archive","correct":false,"reason":"Source is not the runtime process history."},{"text":"Only a CSV format definition","correct":false,"reason":"File schema does not describe process status."}],"takeaway":"Use process-event evidence to investigate workflow progression.","sourceIds":["A-S39"]},{"id":"A077","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"single","stem":"Tenant operators need a clear warning visible on the integration event. Which component fits?","options":[{"text":"Add Integration Message with WARNING severity","correct":true,"reason":"It writes the message to the tenant integration event."},{"text":"Only a developer-local note","correct":false,"reason":"A local note is not visible in the runtime event."},{"text":"A new CSV schema","correct":false,"reason":"A schema does not add an event message."},{"text":"A changed HTTP timeout","correct":false,"reason":"Timeout settings do not explain the warning to operators."}],"takeaway":"Place operational messages where the support team reviews the run.","sourceIds":["A-S40"]},{"id":"A078","topic":"orchestration-troubleshooting","group":"troubleshooting","difficulty":"Applied","type":"multi","stem":"A repeated warning should appear only for records missing a required business identifier. Which two fields support a useful message? Select two answers.","options":[{"text":"Summary and optional Detail with actionable context","correct":true,"reason":"These explain the issue to event reviewers."},{"text":"A random application reference","correct":false,"reason":"Random identifiers do not describe the validation issue."},{"text":"A password embedded in the summary","correct":false,"reason":"Secrets must not be included in operational messages."},{"text":"Condition based on the missing identifier","correct":true,"reason":"It limits emission to the relevant cases."}],"takeaway":"Make event messages selective and actionable.","sourceIds":["A-S40"]},{"id":"A079","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"An integration-system launch does not reach the intended outbound orchestration. Which pair should be verified?","options":[{"text":"Only the developer’s display name","correct":false,"reason":"A person’s label does not select the orchestration."},{"text":"Only the last API response code","correct":false,"reason":"No intended orchestration call may have occurred yet."},{"text":"Application Reference ID and Orchestration Name","correct":true,"reason":"The tenant integration attributes identify the app and workflow."},{"text":"Only the output filename and MIME type","correct":false,"reason":"Those describe output rather than the execution target."}],"takeaway":"Verify tenant-to-app linkage before debugging downstream transformations.","sourceIds":["A-S41"]},{"id":"A080","topic":"outbound-orchestration","group":"io","difficulty":"Advanced","type":"single","stem":"A formatted worker export exists only as a text-template result. What is the next step to provide an event output file?","options":[{"text":"Only increase the API timeout","correct":false,"reason":"The missing step is output persistence, not waiting."},{"text":"Store the template output and enable event attachment","correct":true,"reason":"The value must be persisted and attached for tenant users."},{"text":"Only change its text to include .txt","correct":false,"reason":"A suffix inside text does not persist a file."},{"text":"Only add another GET request","correct":false,"reason":"A read does not store the already formatted document."}],"takeaway":"Complete the extract, transform, and persist path before testing delivery.","sourceIds":["A-S41"]},{"id":"A081","topic":"outbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A connector produces XML, while the receiving API expects a JSON array. Which construction approach fits the course pattern?","options":[{"text":"Iterate XML records, create JSON fragments, and aggregate them","correct":true,"reason":"Structured JSON construction avoids manual delimiter mistakes."},{"text":"Rename the XML file to .json","correct":false,"reason":"Changing an extension does not transform the payload."},{"text":"Send XML while declaring JSON without conversion","correct":false,"reason":"Content and declared format would disagree."},{"text":"Concatenate records without array boundaries","correct":false,"reason":"The resulting text may not be valid JSON."}],"takeaway":"Use typed construction when transforming connector output.","sourceIds":["A-S42"]},{"id":"A082","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"An orchestration must consume a specific connector XML output among event attachments. What should happen before XPath extraction?","options":[{"text":"Assume the first attachment is always the business file","correct":false,"reason":"Other event attachments can be present."},{"text":"Apply JSONPath to unconverted XML","correct":false,"reason":"JSONPath is for JSON structure."},{"text":"Encrypt the document before parsing its business fields","correct":false,"reason":"Encryption does not expose the XML elements."},{"text":"Select the intended labeled document and treat it as XML","correct":true,"reason":"This establishes the correct input and typed view."}],"takeaway":"Identify the input document before interpreting its structure.","sourceIds":["A-S42"]},{"id":"A083","topic":"inbound-orchestration","group":"io","difficulty":"Applied","type":"single","stem":"A scheduled inbound process must read a file from SFTP before processing it. Which business-process ordering is appropriate?","options":[{"text":"Fire Integration before retrieval of its required input","correct":false,"reason":"Processing would precede availability of the file."},{"text":"Approval after delivery as the retrieval mechanism","correct":false,"reason":"Approval does not fetch the source file."},{"text":"Document Retrieval before Fire Integration","correct":true,"reason":"The input must be available when processing begins."},{"text":"Document Delivery before Document Retrieval","correct":false,"reason":"Delivery does not obtain the inbound input."}],"takeaway":"Retrieve the input before launching dependent processing.","sourceIds":["A-S43"]},{"id":"A084","topic":"outbound-orchestration","group":"io","difficulty":"Advanced","type":"single","stem":"An outbound file must be reviewed after generation and before SFTP delivery. Where should approval be placed?","options":[{"text":"Inside the filename expression","correct":false,"reason":"A filename expression is not an approval step."},{"text":"After Fire Integration and before Document Delivery","correct":true,"reason":"This permits review of the generated output before release."},{"text":"Only after Document Delivery","correct":false,"reason":"The file would already have been sent."},{"text":"Before generation when the generated file must be reviewed","correct":false,"reason":"The requested output does not yet exist for review."}],"takeaway":"Place approval at the point where the required evidence exists.","sourceIds":["A-S43"]}],"sources":[{"id":"C-S01
